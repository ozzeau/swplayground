--[[
Whenever you want to set a color, you call setColor([name of the color]). ex. setColor("Sky")
If nightmode is active, it will automaticallty switch.
If you input a manual opacity, that will be used, otherwise the opacity given in the color code will be used. If neither are present, than opacity will be set to full.
]]
function setColor(colorName,opacity)
    colorSelect = colors[colorName]
    if nightMode then
        colorSelect = colorSelect[2]
    else
        colorSelect = colorSelect[1]
    end

    realOpacity = opacity or 255
    if not opacity then
        if #colorSelect >= 4 then
            opacity = colorSelect[4]
        else
            opacity = 255
        end
    end
    screen.setColor(colorSelect[1],colorSelect[2],colorSelect[3],opacity)
end

function onTick()

    altitude = input.getNumber(2)
    nightMode = input.getBool(1)

    -- Code Below using Quale's matrix math on Physics Sensor
    -- Get angles.
    x = input.getNumber(4)
    y = input.getNumber(5)
    z = input.getNumber(6)
    cx, sx = math.cos(x), math.sin(x)
    cy, sy = math.cos(y), math.sin(y)
    cz, sz = math.cos(z), math.sin(z)
    m02 = sx*sz + cx*sy*cz
    rollLi = math.atan(cy*sz, math.sqrt((cy*cz)^2 + sy^2)) / math.pi*2
    rollU = math.atan(cx*cz + sx*sy*sz, math.sqrt((-cx*sz + sx*sy*cz)^2 + (sx*cy)^2)) / math.pi*2
    rollF = -math.atan(-sx*cz + cx*sy*sz, math.sqrt(m02^2 + (cx*cy)^2))
    rollL = math.atan(math.sin(rollLi), math.sin(rollU)) + math.pi/2
    compass = (input.getNumber(17) * math.pi * -2) * (180/math.pi) % 360

    --Used for velocity vector
    speedX = input.getNumber(7)
    speedY = input.getNumber(8)
    speedZ = input.getNumber(9)

    --base speed is necessary to keep to manatain linearity in certain features whenever changing between units
    baseSpeed = input.getNumber(13)
    speed = baseSpeed*speedMultiplier

    verticalSpeed = (prvAlt-altitude)*verticalSpeedFactor*-60
    prvAlt = altitude

    --If vertical speed indicator is on, this will offset everything from the right of the screen by one pixel
    if verticalSpeedIndicator then
        vertspdhorizoffset = -1
    else vertspdhorizoffset = 0 end

    --Convert altitude into the rite unit and save said unit for later
    if altUnitsNum == 1 then
        altitude = altitude*3.28084+.5
        altitudeToDisplay = math.floor(altitude)
        altUnits = "ft"
        if altitude > 7500 then
            altUnits = "fl"
            altitudeToDisplay = math.floor(altitude/100)
        end
    else
        altUnits = "M"
        altitudeToDisplay = math.floor(altitude+.5)
    end

    --[[
    Generate all the bar points for the pitch bars at every single angle.
    If you wanted to change the spacing between the pitch bars, this is where you would do it, by changing the 150 multiplier
    ]]
    barPoints = {}
    cosRoll = math.cos(rollL)
    sinRoll = math.sin(rollL)
    negCosRoll = math.cos(-rollL)
    negSinRoll = math.sin(-rollL)
    for i = drawBars, 18, drawBars do
        barPoints[i] = {}
        for a,b in ipairs(allBarPoints) do
            diffUpper = (i*(math.pi/18)-rollF)*150
            diffLower = (-i*(math.pi/18)-rollF)*150
            for k = -1, 1, 2 do
                displace = math.max(k,0)
                barPoints[i][(a-1)*4+2+k] = {x=math.floor(width/2-1 + (cosRoll*(diffLower+b[2]))+negSinRoll* -k * b[1]+displace),y=math.floor(height/2 + (sinRoll*(diffLower+b[2]))+negCosRoll* -k * b[1])}
                barPoints[i][(a-1)*4+3+k] = {x=math.floor(width/2-1 + (cosRoll*(diffUpper-b[2]))+negSinRoll* -k * b[1]+displace),y=math.floor(height/2 + (sinRoll*(diffUpper-b[2]))+negCosRoll* -k * b[1])}
            end
        end
    end
end

function onDraw()

    --anytime the screen is drawn, get the width and height.
    if screen.getWidth() ~= 0 then
        width,height = screen.getWidth(),screen.getHeight()
    end

    --Generate the center of the screen after all the adjustments
    centerX = width/2-1
    centerY = (topPadding/2)+((height-bottomPadding)/2)

    --generate the line along the horizon. This is needed even if you are not using the horizon line.
    horizonBar = {{},{}}
    horizonBar[1].y = centerY + (sinRoll*(-rollF*150))+negCosRoll*200
    horizonBar[2].y = centerY + (sinRoll*(-rollF*150))+negCosRoll*-200
    horizonBar[1].x = centerX + (cosRoll*(-rollF*150))+negSinRoll*200
    horizonBar[2].x = centerX + (cosRoll*(-rollF*150))+negSinRoll*-200

    --This is how the sky and ground is drawn. Calculate a slope and offset (If you don't know how to do this, you are either in middle school or stupid)
    slope = (horizonBar[2].y-horizonBar[1].y)/(horizonBar[2].x-horizonBar[1].x)
    b = ((centerX-horizonBar[1].x)*slope)+horizonBar[1].y
    inverted = 1
    if math.abs(rollL-math.pi/2) > math.pi/2 then inverted = -1 end
    --Draw lines along the horizon bar reaching up to the top and bottom of each screen with the corresponding color.
    for i = 0,width-1 do
        origin = slope*(i-centerX)+b
        --Upper Region
        setColor("Sky")
        screen.drawLine(i,origin,i,-1000*inverted)

        --Lower Region
        setColor("Ground")
        screen.drawLine(i,origin,i,1000*inverted)
    end

    --If you want to draw the horizon line
    if drawCenter then
        setColor("Horizon Line")
        screen.drawLine(horizonBar[1].x,horizonBar[1].y,horizonBar[2].x,horizonBar[2].y)
    end

    --drawBars == 0 means do not draw pitch bars
    if drawBars > 0 then
        --drawBars == 0.5 means every 5 degrees, while drawBars == 1 means every 10 degrees
        for i = drawBars, 18, drawBars do
            if i ~= 9 then

                --simple calculations for if you want the pitch bars to fade the further away from center they are
                if fadeActive then
                    new = math.abs((math.abs(i)*(math.pi/18)-math.abs(rollF))*150)*1.5
                else
                    new = 0
                end

                setColor("Bar",clamp(220-new,0,220))

                --Now is where you finally draw the pitch bars
                for a,b in ipairs(barStyle) do
                    screen.drawLine(barPoints[i][b[1]].x,barPoints[i][b[1]].y,barPoints[i][b[2]].x,barPoints[i][b[2]].y)
                end

                --showDegrees == 0 means no labels, showDegrees == 1 means only show the 10 degree labels, while showDegrees == 2 means show all (5 degrees) labels
                if showDegrees > 0 then
                    numToShow = ""
                    if (i%1) == 0 then
                        numToShow = tostring(math.abs(math.floor(-math.abs(-i+9)+9)))
                    end
                    if showDegrees == 2 then
                        numToShow = tostring(math.abs(math.floor((-math.abs(-i+9)+9)*10)))
                    end

                    setColor("Bar Text",clamp(220-new,0,220))
                    --draw the labels, trying to keep them aligned and centered well with the pitch bars
                    numLength = numToShow:len()
                    Txt(barPoints[i][37].x-(numLength-1)*font,barPoints[i][37].y-2,numToShow)
                    Txt(barPoints[i][38].x-(numLength-1)*font,barPoints[i][38].y-2,numToShow)
                    Txt(barPoints[i][39].x-3,barPoints[i][39].y-2,numToShow)
                    Txt(barPoints[i][40].x-3,barPoints[i][40].y-2,numToShow)
                end
            --i == 9 means straight up or down
            elseif i == 9 then
                --Just draw a X at the top and bottom
                new = math.abs((math.abs(i)*(math.pi/18)-math.abs(rollF))*150)*1.5
                setColor("Bar",clamp(220-new,0,220))
                screen.drawLine(barPoints[i][41].x,barPoints[i][41].y,barPoints[i][47].x,barPoints[i][47].y)
                screen.drawLine(barPoints[i][42].x,barPoints[i][42].y,barPoints[i][48].x,barPoints[i][48].y)
                screen.drawLine(barPoints[i][43].x,barPoints[i][43].y,barPoints[i][45].x,barPoints[i][45].y)
                screen.drawLine(barPoints[i][44].x,barPoints[i][44].y,barPoints[i][46].x,barPoints[i][46].y)
            end
        end
    end

    --You may know as the prograde indicator if you played KSP. This draws the direction you are moving.
    if enableVelocityVector then
        vectorX = math.atan(speedX,speedZ)*height
        vectorY = -math.atan(speedY,speedZ)*height
        setColor("Velocity Vector")
        --Only draw it if you are going faster than 1m/s so you don't get it spazzing all over your screen because you are slip and sliding around.
        if baseSpeed > 1 then
            screen.drawCircle(centerX+vectorX-1,centerY+vectorY,3)
            screen.drawLine(centerX-4+vectorX,centerY+vectorY,centerX-7+vectorX,centerY+vectorY)
            screen.drawLine(centerX+vectorX-1,centerY-3+vectorY,centerX+vectorX-1,centerY-5+vectorY)
            screen.drawLine(centerX+2+vectorX,centerY+vectorY,centerX+5+vectorX,centerY+vectorY)
        end
    end

    --Steering Bar
    setColor("Steering Bar")
    for a,b in pairs(steeringBar) do
        screen.drawLine(centerX+b[1],centerY+b[2],centerX+b[3],centerY+b[4])
    end

    setColor("Wheel Background")

    --These are all the background areas for the indicator wheels. These first three draw the main areas depending on if each one is on.
    --You need the speed indicator on to show the speed wheel
    if speedWheel and showSpeed then
        screen.drawRectF(0,6,font*2+1,height-12-bottomPadding)
    end
    --You need the altitude indicator on to show the altitude wheel
    if altitudeWheel and showAltitude then
        screen.drawRectF(width-(font*2)-1+vertspdhorizoffset,6,(font*2)+1-vertspdhorizoffset,height-12)
    end

    --the compass wheel will show whether or not you have the indicator on
    if showCompassWheel then
        --whether to draw the compass at the top or bottom of the screen
        if compassTop then
            screen.drawRectF((font*2)+1,topPadding,width-((font*2)+1)*2+vertspdhorizoffset,6)
        else
            screen.drawRectF((font*2)+1,height-6-bottomPadding,width-((font*2)+1)*2+vertspdhorizoffset,6)
        end
    end

    --Because the background is likeley transparent. The 4 corners are drawn seperately depending on what is enabled
    if (showCompassWheel and not compassTop) or speedWheel then
        screen.drawRectF(0,height-6-bottomPadding,(font*2)+1,6)
    end
    if (showCompassWheel and not compassTop) or altitudeWheel then
        screen.drawRectF(width-(font*2)-1+vertspdhorizoffset,height-6-bottomPadding,(font*2)+1-vertspdhorizoffset,6)
    end

    if (showCompassWheel and compassTop) or speedWheel then
        screen.drawRectF(0,topPadding,(font*2)+1,6)
    end
    if (showCompassWheel and compassTop) or altitudeWheel then
        screen.drawRectF(width-(font*2)-1+vertspdhorizoffset,topPadding,(font*2)+1-vertspdhorizoffset,6)
    end

    --Draw the speed wheel text
    if speedWheel and showSpeed then
        for i = math.floor((speed-(height/32*20))/10)*10, math.floor((speed+(height/32*20))/10)*10, 10 do
            fadeValue = clamp(((math.abs(1/(i-speed))*(height/64))^1.5*6000-20),0,255)
            if not speedWheelFade then
                fadeValue = 255
            end
            setColor("Speed Wheel Text",fadeValue)

            speedBarToDisplay = string.sub(string.format("%02d",math.floor(i)),1,2)
            if i >= 0 then Txt(1,(centerY-2+(speed-i)),tostring(speedBarToDisplay)) end
        end
    end

    --Draw the altitude wheel text
    if altitudeWheel and showAltitude then
        for i = math.floor((altitude-(height/32*20))/10)*10, math.floor((altitude+(height/32*20))/10)*10, 10 do
            fadeValue = clamp(((math.abs(1/(i-altitude))*(height/64))^1.5*6000-20),0,255)
            if not altitudeWheelFade then
                fadeValue = 255
            end
            setColor("Altitude Wheel Text",fadeValue)

            altBarToDisplay = string.sub(string.format("%02d",math.floor(i)),1,2)
            if i >= 0 then Txt(width-(font*2)+vertspdhorizoffset,(centerY-2+(altitude-i)),tostring(i)) end
        end
    end

    --Draw the compass wheel ticks and text
    if showCompassWheel then
        for i = -360, 720,10 do
            diff = i-compass
            fadeValue = clamp(150-(math.abs(diff)*4.5/(width/64)),0,150)
            if not compassWheelFade then
                fadeValue = 255
            end
            setColor("Compass Wheel",fadeValue)

            vertPos = height-6-bottomPadding
            if compassTop then
                vertPos = topPadding
            end

            --Draws letters are North, East, South, and West
            if i == 0 or i == 360 then
                Txt(centerX+diff-(font-3),vertPos,"N")
            elseif i == 90 then
                Txt(centerX+diff-(font-3),vertPos,"E")
            elseif i == 180 then
                Txt(centerX+diff-(font-3),vertPos,"S")
            elseif i == 270 then
                Txt(centerX+diff-(font-3),vertPos,"W")
            else
                screen.drawLine(centerX+diff,vertPos+6,centerX+diff,vertPos)
            end
        end
    end

    --Speed Indicator
    if showSpeed then
        setColor("Text Background")
        --if the speed units are off, then no need to draw two lines worth of background
        if showSpeedUnits then
            screen.drawRectF(0,centerY-6,1+(font*3),13)
        else
            screen.drawRectF(0,centerY-3,1+(font*3),7)
        end

        --The outline for the indicator
        if outlineSpeed then
            setColor("Speed Indicator Outline")
            if showSpeedUnits then
                screen.drawRect(-1,centerY-7,2+(font*3),14)
            else
                screen.drawRect(-1,centerY-4,2+(font*3),8)
            end
        end

        --Draw the text.
        setColor("Speed Text")
        if showSpeedUnits then
            Txt(1,centerY-5,tostring(math.floor(speed)))
            Txt(1,centerY+1,spdUnits)
        else
            Txt(1,centerY-2,tostring(math.floor(speed)))
        end
    end

    --Altitude indicator
    if showAltitude then
        setColor("Text Background")
        --if the altitude units are off, then no need to draw two lines worht of background
        if showAltUnits then
            screen.drawRectF(width-(1+(font*4))+vertspdhorizoffset,centerY-6,(1+(font*4))-vertspdhorizoffset,13)
        else
            screen.drawRectF(width-(1+(font*4))+vertspdhorizoffset,centerY-3,(1+(font*4))-vertspdhorizoffset,7)
        end

        --outline the indicator
        if outlineAlt then
            setColor("Altitude Indicator Outline")
            if showAltUnits then
                screen.drawRect(width-(2+(font*4))+vertspdhorizoffset,centerY-7,(2+(font*4))-vertspdhorizoffset,14)
            else
                screen.drawRect(width-(2+(font*4))+vertspdhorizoffset,centerY-4,(2+(font*4))-vertspdhorizoffset,8)
            end
        end

        --draw the text
        altLength = tostring(math.floor(altitudeToDisplay)):len()
        setColor("Altitude Text")
        if showAltUnits then
            Txt(width-(altLength*font)+vertspdhorizoffset,centerY-5,tostring(altitudeToDisplay))
            Txt(width-(font*altUnits:len())+vertspdhorizoffset,centerY+1,tostring(altUnits))
        else
            Txt(width-(altLength*font)+vertspdhorizoffset,centerY-2,tostring(altitudeToDisplay))
        end
    end

    --The compass reading
    if showCompass then
        setColor("Text Background")
        --strange VScode versus in game issue, I have this here for testing
        offset = 0

        --Whether or not to draw the compass on the top or bottom of the screen
        if compassTop then
            screen.drawRectF(centerX-math.floor(((font*3)/2))-(font-4)+offset,topPadding,(font*3)+1,7)
        else
            screen.drawRectF(centerX-math.floor(((font*3)/2))-(font-4)+offset,height-7-bottomPadding,(font*3)+1,7)
        end

        --Outline...
        if outlineCompass then
            setColor("Compass Outline")
            if compassTop then
                screen.drawRect(centerX-math.floor(((font*3)/2))-(font-3)+offset,topPadding-1,(font*3)+2,8)
            else
                screen.drawRect(centerX-math.floor(((font*3)/2))-(font-3)+offset,height-8-bottomPadding,(font*3)+2,8)
            end
        end

        --Text...
        setColor("Compass Text")
        compassLength = tostring(math.floor(compass+.5)):len()
        if compassTop then
            Txt(centerX-(compassLength*(font/2))+1,topPadding+1,tostring(math.floor(compass+0.5)))
        else
            Txt(centerX-(compassLength*(font/2))+1,height-6-bottomPadding,tostring(math.floor(compass+0.5)))
        end
    end

    --The vertical speed indicator will be drawn on the right side of the screen
    if verticalSpeedIndicator then
        --draw a one pixel bar on the right side
        setColor("Vertical Speed Background")
        screen.drawRectF(width-1,0,1,height)

        --Draw a line from center showing the vertical speed
        if math.abs(verticalSpeed) > 1 then
            setColor("Vertical Speed")

            --dyanmic color is like a heat color indicator for how fast
            if vspeedDynamicColor then
                screen.setColor(clamp(math.abs(verticalSpeed)*2-30,0,150),150-clamp(math.abs(verticalSpeed)*2-30,0,150),0)
            end

            --The line...
            screen.drawRectF(width-1,centerY,1,-verticalSpeed/3*(height/64))
        end
    end

    --If you have padding on, then that area will be drawn over in black, you can remove this if you want to see into those areas.
    screen.setColor(0,0,0)
    screen.drawRectF(0,height-bottomPadding,width,bottomPadding)
    screen.drawRectF(0,0,width,topPadding)

end

--Combination text function using Alyosha's 3x5 font (unreleased), and the default text function.
function Txt(x,y,t)
    x,y = math.floor(x),math.floor(y)
    t=tostring(t)

    --if font==4 means alyosha's, beacuse there are 4 pixels between the start of each character
    if font == 4 then
        for i=1,#t do
            g=t:sub(i,i):upper():byte()-31
            g=F[g>65 and g-26 or g]
            for j=1,#g do
                h=g[j]
                screen.drawLine(x+h[1],y+h[2],x+h[3],y+h[4])
            end
            x=x+4
        end
    --if font==5 means the default since ,there are 5 pixels between the start of each character.
    elseif font == 5 then
        screen.drawText(x,y,t)
    end
end`,
};
function buildExampleList(){
  const sel=document.getElementById('exampleSel');
  for(const name in EXAMPLES){ const o=document.createElement('option'); o.value=name; o.textContent=name; sel.appendChild(o); }
}

/* ============================================================================
   11. DOCS + LUA NOTES content
============================================================================ */
document.getElementById('tab-docs').innerHTML = `
  <h3>Lifecycle</h3>
  <div class="fn"><b>onTick()</b> — runs 60×/second. Put logic, maths, reading inputs and setting outputs here.</div>
  <div class="fn"><b>onDraw()</b> — runs each frame. The <i>only</i> place <code>screen.*</code> works. The screen is wiped to black before it runs.</div>
  <h3>screen — drawing</h3>
  <div class="fn"><b>screen.getWidth() / getHeight()</b> → monitor size in pixels.</div>
  <div class="fn"><b>screen.setColor(r,g,b[,a])</b> — 0-255. Stays set until changed. In game, colours render washed-out (gamma) — the "SW colours" toggle mirrors that.</div>
  <div class="fn"><b>screen.drawClear()</b> — fill the whole screen with the current colour.</div>
  <div class="fn"><b>screen.drawText(x,y,text)</b> — x,y = top-left. 4×5 glyphs, 5px per char (space 4px), 6px line spacing. Pixel-exact in-game font.</div>
  <div class="fn"><b>screen.drawTextBox(x,y,w,h,text,hAlign,vAlign)</b> — wrapped + aligned (-1/0/1).</div>
  <div class="fn"><b>screen.drawRect / drawRectF (x,y,w,h)</b> — outline / filled. Quirk: the outline actually spans <b>w+1 × h+1</b> pixels in-game (replicated here).</div>
  <div class="fn"><b>screen.drawCircle / drawCircleF (x,y,r)</b> — outline / filled. In-game circles are really polygons: 8 sides (r&lt;20), 12 (r&lt;28), 16 (r≥28) — replicated here.</div>
  <div class="fn"><b>screen.drawLine(x1,y1,x2,y2)</b> — quirk: the final pixel is <b>not</b> drawn in-game (replicated here). Add +0.25 to x2,y2 to include it — the drawing tool does this for you.</div>
  <div class="fn"><b>screen.drawTriangle / drawTriangleF (x1,y1,x2,y2,x3,y3)</b></div>
  <h3>input — signals coming in</h3>
  <div class="fn"><b>input.getNumber(channel)</b> → number on channel 1-32.</div>
  <div class="fn"><b>input.getBool(channel)</b> → true/false on channel 1-32.</div>
  <h3>output — signals going out</h3>
  <div class="fn"><b>output.setNumber(channel, value)</b></div>
  <div class="fn"><b>output.setBool(channel, value)</b></div>
  <p style="margin-top:12px">Note: <code>screen.drawMap</code>, <code>property.*</code> and map colours exist as stubs so map/property scripts don't crash — but maps aren't rendered in this simulator.</p>
`;
document.getElementById('tab-notes').innerHTML = `
  <h3>The mental model</h3>
  <ul>
    <li>A microcontroller calls your <b>onTick()</b> 60×/sec, then <b>onDraw()</b> to paint the monitor.</li>
    <li><b>Globals persist</b> between ticks — use them for state (a speed, a counter). <b>local</b> variables vanish at the end of each call.</li>
    <li>Always <b>initialise globals</b> (e.g. <code>speed = 0</code>). Doing maths on an uninitialised (nil) value is the #1 beginner error.</li>
  </ul>
  <h3>Lua quirks vs. other languages</h3>
  <ul>
    <li>Indexes start at <b>1</b>, not 0. Input channels are <b>1-32</b>.</li>
    <li>Join strings with <code>..</code> not <code>+</code> → <code>"v=" .. value</code>.</li>
    <li><b>not-equal</b> is <code>~=</code>. Logic words are <code>and / or / not</code>.</li>
    <li>No <code>++</code>. Write <code>x = x + 1</code>.</li>
    <li>Comments are <code>--</code> (line) and <code>--[[ ... ]]</code> (block).</li>
    <li>Only <code>nil</code> and <code>false</code> are falsy. <b>0 is true!</b></li>
    <li><code>if cond then ... elseif ... else ... end</code> — blocks close with <code>end</code>.</li>
    <li>Loops: <code>for i = 1, 10 do ... end</code> (inclusive). <code>while cond do ... end</code>.</li>
  </ul>
  <h3>Maths you'll keep using</h3>
  <ul>
    <li><code>math.sin / cos</code> take <b>radians</b>. <code>math.rad(deg)</code>, <code>math.deg(rad)</code>, <code>math.pi</code>.</li>
    <li><code>math.floor / ceil / abs / min / max / sqrt</code>, <code>math.random()</code>.</li>
    <li><code>%</code> is remainder — great for "every N ticks" timing.</li>
    <li>The <b>map()</b> helper (Example 4) converts any range to any other — the heart of every gauge, bar and needle.</li>
  </ul>
`;

/* ============================================================================
   12. AUTOSAVE — code + settings persist in the browser (localStorage)
============================================================================ */
const LS='swlua.';
function lsGet(k){ try{ return localStorage.getItem(LS+k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(LS+k,v); }catch(e){} }
function saveSettings(){
  lsSet('size',document.getElementById('sizeSel').value);
  lsSet('zoom',document.getElementById('zoomSel').value);
  lsSet('color',document.getElementById('toolColor').value);
  lsSet('grid',gridOn?'1':'0');
  lsSet('gamma',gammaOn?'1':'0');
}
function restoreSettings(){
  const size=lsGet('size'); if(size && [...document.getElementById('sizeSel').options].some(o=>o.value===size)) document.getElementById('sizeSel').value=size;
  const zoom=lsGet('zoom'); if(zoom!==null && [...document.getElementById('zoomSel').options].some(o=>o.value===zoom)) document.getElementById('zoomSel').value=zoom;
  const col=lsGet('color'); if(col && /^#[0-9a-fA-F]{6}$/.test(col)) document.getElementById('toolColor').value=col;
  const grid=lsGet('grid'); if(grid!==null){ gridOn=(grid==='1'); document.getElementById('gridChk').checked=gridOn; }
  const gam=lsGet('gamma'); if(gam!==null){ gammaOn=(gam==='1'); document.getElementById('gammaChk').checked=gammaOn; }
}

/* ============================================================================
   13. WIRE UP
============================================================================ */
function applySize(){
  const [w,h]=document.getElementById('sizeSel').value.split('x').map(Number);
  Screen.setSize(w,h);
  Screen.clear(0,0,0);
  renderCanvas();
  if(codeLoaded) reset();       // recompile & resume live at the new resolution
}

window.addEventListener('load', ()=>{
  Screen.attach(document.getElementById('screen'));
  initEditor();
  buildExampleList();
  buildInputUI();
  restoreSettings();
  applySize();
  if(window.lucide) lucide.createIcons();   // render the toolbar icons

  // restore the last session's code, or load the blank template
  const savedCode=lsGet('code');
  if(savedCode!==null && savedCode.trim()!==''){
    setCode(savedCode);
    logLine('Restored your last drawing (autosaved in this browser).','info');
  } else {
    setCode(EXAMPLES["0 · Blank (onTick + onDraw)"]);
    document.getElementById('exampleSel').value="0 · Blank (onTick + onDraw)";
  }
  syncChannelsFromCode();
  setTool('move');

  // keep the Inputs panel mirrored to the code AND recompile live as you type (debounced)
  let syncTimer=null;
  const onEdit=()=>{ clearTimeout(syncTimer); syncTimer=setTimeout(()=>{ syncChannelsFromCode(); liveReload(); lsSet('code', getCode()); }, 350); };
  if(cm) cm.on('change', onEdit); else document.getElementById('editor').addEventListener('input', onEdit);

  // controls
  document.getElementById('stepBtn').addEventListener('click', step);
  document.getElementById('resetBtn').addEventListener('click', reset);
  document.getElementById('sizeSel').addEventListener('change', ()=>{ applySize(); saveSettings(); });
  document.getElementById('zoomSel').addEventListener('change', ()=>{ renderCanvas(); saveSettings(); });
  document.getElementById('exampleSel').addEventListener('change', e=>{ const n=e.target.value; if(EXAMPLES[n]){ stopLoop(); setCode(EXAMPLES[n]); syncChannelsFromCode(); reset(); logLine('Loaded "'+n+'".','info'); } });

  // dynamic add-input buttons
  document.getElementById('addNum').addEventListener('click', addNumInput);
  document.getElementById('addBool').addEventListener('click', addBoolInput);

  // copy button
  document.getElementById('copyBtn').addEventListener('click', copyCode);
  document.getElementById('copyCompactBtn').addEventListener('click', copyCompact);

  // tool palette
  document.querySelectorAll('#screenToolbar [data-tool]').forEach(b=>b.addEventListener('click',()=>setTool(b.dataset.tool)));
  document.getElementById('fillToggle').addEventListener('click', ()=>setFill(!fillShape));
  document.getElementById('toolColor').addEventListener('change', ()=>{ commitColor(); saveSettings(); });   // picking a colour writes it to code now
  document.getElementById('undoBtn').addEventListener('click', doUndo);
  document.getElementById('redoBtn').addEventListener('click', doRedo);
  document.getElementById('gridChk').addEventListener('change', e=>{ gridOn=e.target.checked; renderCanvas(); saveSettings(); });
  document.getElementById('gammaChk').addEventListener('change', e=>{ gammaOn=e.target.checked; renderCanvas(); saveSettings(); });
  const sc=document.getElementById('screen');
  sc.addEventListener('mousedown', e=>{ e.preventDefault(); toolDown(e); });
  window.addEventListener('mousemove', e=>{ if(dragStart||moveTarget) toolMove(e); });
  window.addEventListener('mouseup', e=>{ if(dragStart||moveTarget) toolUp(e); });

  // keyboard shortcuts (Photoshop-style), ignored while typing in the editor / inputs
  window.addEventListener('keydown', e=>{
    const ae=document.activeElement, typing = ae && (/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName) || ae.isContentEditable);
    if(e.ctrlKey||e.metaKey){
      const k=e.key.toLowerCase();
      if(k==='z' && !typing){ e.preventDefault(); e.shiftKey?doRedo():doUndo(); }
      else if(k==='y' && !typing){ e.preventDefault(); doRedo(); }
      return;
    }
    if(e.altKey || typing) return;
    const map={v:'move',l:'line',r:'rect',c:'circle',y:'triangle',t:'text',i:'eyedropper',e:'eraser'};
    const k=e.key.toLowerCase();
    if(map[k]){ setTool(map[k]); e.preventDefault(); }
    else if(k==='f'){ setFill(!fillShape); e.preventDefault(); }
  });

  // tabs
  document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.tabpane').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); document.getElementById('tab-'+b.dataset.tab).classList.add('active');
  }));

  window.addEventListener('resize', ()=>{ if(document.getElementById('zoomSel').value==='0') renderCanvas(); });

  // start running live
  if(!fengariReady){
    logLine("⚠ Lua engine (Fengari) didn't load — you're probably offline.",'err');
    logLine("Connect to the internet once and reload; the browser caches it for offline use afterward.",'info');
  } else {
    reset();   // compile the default example and run it live
    logLine("Running live — edits apply automatically. Step to freeze a frame, Reset to restart.",'info');
  }
});
</script>
