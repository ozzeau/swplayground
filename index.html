<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stormworks Lua Playground</title>

<!-- CodeMirror (editor with Lua syntax highlighting). Loaded from CDN; -->
<!-- if you are offline the editor falls back to a plain text box. -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/lua/lua.min.js"></script>

<!-- Fengari: a real Lua 5.3 virtual machine in JavaScript (Stormworks uses Lua 5.3.5). -->
<script src="https://cdn.jsdelivr.net/npm/fengari-web@0.1.4/dist/fengari-web.js"></script>

<!-- Lucide: clean line icons (Photoshop-style tool glyphs). Pinned for stability. -->
<script src="https://cdn.jsdelivr.net/npm/lucide@1.16.0/dist/umd/lucide.min.js"></script>

<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1c2230; --border:#2a3140;
    --text:#d7dde7; --dim:#8a93a3; --accent:#39d98a; --accent2:#3aa0ff;
    --warn:#ff5c5c; --yellow:#ffcf52;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Segoe UI",system-ui,sans-serif; font-size:14px;
    display:flex; flex-direction:column; overflow:hidden;
  }
  header{
    display:flex; align-items:center; gap:14px; padding:8px 14px;
    background:var(--panel); border-bottom:1px solid var(--border); flex-wrap:wrap;
  }
  header h1{font-size:15px; margin:0; font-weight:600; letter-spacing:.3px}
  header h1 span{color:var(--accent)}
  .ctrl{display:flex; align-items:center; gap:6px}
  label.lbl{color:var(--dim); font-size:12px}
  select,button,input{font-family:inherit}
  select{
    background:var(--panel2); color:var(--text); border:1px solid var(--border);
    border-radius:6px; padding:5px 8px; font-size:13px;
  }
  button{
    background:var(--panel2); color:var(--text); border:1px solid var(--border);
    border-radius:6px; padding:6px 12px; cursor:pointer; font-size:13px;
  }
  button:hover{border-color:var(--accent2)}
  button.primary{background:var(--accent); color:#06231a; border-color:var(--accent); font-weight:600}
  button.primary:hover{filter:brightness(1.08)}
  button.stop{background:var(--warn); color:#2a0a0a; border-color:var(--warn); font-weight:600}
  .spacer{flex:1}
  .tickinfo{color:var(--dim); font-size:12px; font-variant-numeric:tabular-nums}

  main{flex:1; display:flex; min-height:0}
  .left{display:flex; flex-direction:column; width:50%; min-width:300px; border-right:1px solid var(--border)}
  .right{display:flex; flex-direction:column; flex:1; min-width:340px}

  .editor-wrap{flex:1; min-height:0; display:flex; flex-direction:column}
  .CodeMirror{height:100%; font-size:13px; line-height:1.45}
  #editor{
    flex:1; width:100%; resize:none; border:0; outline:0; padding:10px;
    background:#10141b; color:var(--text); font-family:"Consolas",monospace; font-size:13px;
    tab-size:4; line-height:1.45;
  }
  .editor-bar{
    display:flex; align-items:center; gap:8px; padding:6px 10px;
    background:var(--panel); border-bottom:1px solid var(--border); flex-wrap:wrap;
  }
  .console{
    height:130px; overflow:auto; background:#0a0d12; border-top:1px solid var(--border);
    padding:6px 10px; font-family:"Consolas",monospace; font-size:12px; white-space:pre-wrap;
  }
  .console .err{color:var(--warn)}
  .console .info{color:var(--dim)}
  .console .print{color:var(--accent)}

  .screen-wrap{display:flex; flex-direction:column; flex:0 0 auto; border-bottom:1px solid var(--border)}
  .screen-toolbar{
    display:flex; align-items:center; gap:10px; padding:6px 12px; flex-wrap:wrap;
    background:var(--panel); border-bottom:1px solid var(--border); font-size:12px;
  }
  .screen-toolbar label{display:flex; align-items:center; gap:5px; color:var(--dim); cursor:pointer}
  .screen-toolbar .sep{width:1px; align-self:stretch; background:var(--border); margin:0 2px}
  .screen-toolbar button{padding:4px 9px; font-size:12px}
  .screen-toolbar input[type=color]{width:26px; height:22px; padding:0; border:1px solid var(--border); border-radius:4px; background:none; cursor:pointer}
  .screen-toolbar button.toggled{background:var(--accent2); color:#04141f; border-color:var(--accent2); font-weight:600}
  .screen-toolbar [data-tool]{width:30px; display:inline-flex; align-items:center; justify-content:center; padding:5px 0}
  .screen-toolbar svg, .editor-bar svg{width:15px; height:15px; stroke-width:2}
  #copyBtn,#copyCompactBtn{display:inline-flex; align-items:center; gap:5px}
  #fillToggle{display:inline-flex; align-items:center; padding:5px 7px}
  .screen-toolbar select{padding:4px 6px; font-size:12px}
  .screen-area{
    display:flex; align-items:center; justify-content:center;
    background:#05070a; padding:14px; min-height:340px;
  }
  #screen{
    image-rendering:pixelated; image-rendering:crisp-edges;
    background:#000; box-shadow:0 0 0 2px #000, 0 0 22px rgba(0,0,0,.6);
  }
  #screen.drawing{cursor:crosshair}
  .textpop{position:fixed; z-index:9999; background:var(--panel2); border:1px solid var(--accent2); border-radius:6px; padding:4px; box-shadow:0 6px 18px rgba(0,0,0,.55)}
  .textpop input{background:#10141b; color:var(--text); border:1px solid var(--border); border-radius:4px; padding:5px 7px; font-size:13px; width:130px; outline:none}
  .panel-tabs{display:flex; gap:2px; background:var(--panel); border-bottom:1px solid var(--border); padding:6px 8px 0}
  .panel-tabs button{
    border-radius:6px 6px 0 0; border-bottom:0; padding:6px 12px; font-size:12px;
    background:transparent; color:var(--dim); border-color:transparent;
  }
  .panel-tabs button.active{background:var(--panel2); color:var(--text); border-color:var(--border)}
  .panel-body{flex:1; overflow:auto; background:var(--panel2)}
  .tabpane{display:none; padding:12px 14px}
  .tabpane.active{display:block}

  .io-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px}
  .io-col h3{margin:0 0 8px; font-size:12px; color:var(--accent2); text-transform:uppercase; letter-spacing:.5px}
  .chan{display:grid; grid-template-columns:22px 42px 1fr 42px 46px 16px; align-items:center; gap:5px; margin-bottom:7px}
  .chan .cl{color:var(--dim); font-size:12px; font-variant-numeric:tabular-nums}
  .chan input[type=range]{width:100%}
  .chan input[type=number]{width:100%; background:#10141b; color:var(--text); border:1px solid var(--border); border-radius:4px; padding:3px 3px; font-size:11px}
  .chan input.minbox,.chan input.maxbox{color:var(--dim)}
  .bchan{display:flex; align-items:center; gap:8px; margin-bottom:6px}
  .bchan .cl{width:26px; color:var(--dim); font-size:12px}
  .rm{background:none; border:0; color:var(--dim); cursor:pointer; font-size:14px; padding:0 2px; line-height:1}
  .rm:hover{color:var(--warn)}
  .addbtn{background:var(--panel); border:1px solid var(--border); color:var(--accent); border-radius:6px; padding:3px 9px; font-size:11px; cursor:pointer; margin-left:6px}
  .addbtn:hover{border-color:var(--accent)}
  .io-col h3{display:flex; align-items:center}
  .out-row{display:flex; justify-content:space-between; padding:3px 6px; border-bottom:1px solid var(--border); font-family:Consolas,monospace; font-size:12px}
  .out-row span:first-child{color:var(--dim)}
  .rangecfg{display:flex; align-items:center; gap:6px; margin-bottom:10px; color:var(--dim); font-size:12px}
  .rangecfg input{width:54px; background:#10141b; color:var(--text); border:1px solid var(--border); border-radius:4px; padding:3px; font-size:12px}

  .docs h3{color:var(--accent2); font-size:13px; margin:14px 0 6px}
  .docs h3:first-child{margin-top:0}
  .docs code{background:#10141b; padding:1px 5px; border-radius:4px; color:var(--yellow); font-family:Consolas,monospace; font-size:12px}
  .docs .fn{margin:5px 0; padding-left:10px; border-left:2px solid var(--border)}
  .docs .fn b{color:var(--text)}
  .docs p{color:var(--dim); margin:4px 0; line-height:1.5}
  .docs ul{margin:6px 0; padding-left:18px; color:var(--dim); line-height:1.6}
  .docs li b{color:var(--text)}
  .hint{color:var(--dim); font-size:12px; margin-left:4px}
</style>
</head>
<body>

<header>
  <h1>Stormworks <span>Lua</span> Playground</h1>
  <div class="ctrl">
    <label class="lbl">Zoom</label>
    <select id="zoomSel">
      <option value="0" selected>Fit</option>
      <option value="2">2×</option>
      <option value="4">4×</option>
      <option value="6">6×</option>
      <option value="8">8×</option>
      <option value="10">10×</option>
      <option value="12">12×</option>
      <option value="16">16×</option>
    </select>
  </div>
  <div class="spacer"></div>
  <span class="tickinfo" id="tickInfo">tick 0 · 0 fps</span>
  <button id="stepBtn">⤳ Step</button>
  <button id="resetBtn" class="primary">⟲ Reset</button>
</header>

<main>
  <div class="left">
    <div class="editor-bar">
      <label class="lbl">Examples</label>
      <select id="exampleSel"></select>
      <button id="copyBtn" title="Copy all code to clipboard"><i data-lucide="copy"></i> Copy</button>
      <button id="copyCompactBtn" title="Copy minified for the 4096-char limit: strips comments/whitespace and aliases repeated screen/input/math calls with readable names (e.g. SDT=screen.drawText). Strings are left intact."><i data-lucide="scissors"></i> Compact</button>
    </div>
    <div class="editor-wrap">
      <textarea id="editor" spellcheck="false"></textarea>
    </div>
    <div class="console" id="console"></div>
  </div>

  <div class="right">
    <div class="screen-wrap">
      <div class="screen-toolbar" id="screenToolbar">
        <select id="sizeSel" title="Monitor size">
          <option value="32x32">1x1 — 32×32</option>
          <option value="64x32">2x1 — 64×32</option>
          <option value="64x64" selected>2x2 — 64×64</option>
          <option value="96x64">3x2 — 96×64</option>
          <option value="96x96">3x3 — 96×96</option>
          <option value="160x96">5x3 — 160×96</option>
          <option value="288x160">9x5 — 288×160</option>
          <option value="256x192">HMD — 256×192</option>
        </select>
        <span class="sep"></span>
        <button data-tool="move" title="Move (V)"><i data-lucide="move"></i></button>
        <button data-tool="line" title="Line (L)"><i data-lucide="pen-line"></i></button>
        <button data-tool="rect" title="Rectangle (R)"><i data-lucide="square"></i></button>
        <button data-tool="circle" title="Circle (C)"><i data-lucide="circle"></i></button>
        <button data-tool="triangle" title="Triangle (Y)"><i data-lucide="triangle"></i></button>
        <button data-tool="text" title="Text (T)"><i data-lucide="type"></i></button>
        <button data-tool="eraser" title="Eraser — click a shape to delete (E)"><i data-lucide="eraser"></i></button>
        <button data-tool="eyedropper" title="Pick colour (I)"><i data-lucide="pipette"></i></button>
        <button id="fillToggle" title="Fill shapes (F)"><i data-lucide="paint-bucket"></i></button>
        <input type="color" id="toolColor" value="#39d98a" title="Colour">
        <span class="sep"></span>
        <button id="undoBtn" title="Undo (Ctrl+Z)"><i data-lucide="undo-2"></i></button>
        <button id="redoBtn" title="Redo (Ctrl+Shift+Z)"><i data-lucide="redo-2"></i></button>
        <span class="sep"></span>
        <label><input type="checkbox" id="gridChk" checked> Grid</label>
        <label title="Simulate the in-game gamma: Stormworks washes colours out on monitors"><input type="checkbox" id="gammaChk" checked> SW colours</label>
      </div>
      <div class="screen-area">
        <canvas id="screen" width="64" height="64"></canvas>
      </div>
    </div>
    <div class="panel-tabs" id="tabs">
      <button data-tab="inputs" class="active">Inputs</button>
      <button data-tab="outputs">Outputs</button>
      <button data-tab="docs">API Docs</button>
      <button data-tab="notes">Lua Notes</button>
    </div>
    <div class="panel-body">
      <div class="tabpane active" id="tab-inputs">
        <div class="rangecfg"><span class="hint">Each number input has its own min / max boxes. Channels mirror your code.</span></div>
        <div class="io-grid">
          <div class="io-col">
            <h3>Numbers <button id="addNum" class="addbtn">+ add</button></h3>
            <div id="numInputs"></div>
          </div>
          <div class="io-col">
            <h3>Booleans <button id="addBool" class="addbtn">+ add</button></h3>
            <div id="boolInputs"></div>
          </div>
        </div>
      </div>

      <div class="tabpane" id="tab-outputs">
        <div class="io-grid">
          <div class="io-col">
            <h3>Numbers (output.setNumber)</h3>
            <div id="numOutputs"><div class="hint">nothing set yet</div></div>
          </div>
          <div class="io-col">
            <h3>Booleans (output.setBool)</h3>
            <div id="boolOutputs"><div class="hint">nothing set yet</div></div>
          </div>
        </div>
      </div>

      <div class="tabpane docs" id="tab-docs"></div>
      <div class="tabpane docs" id="tab-notes"></div>
    </div>
  </div>
</main>

<script>
/* ============================================================================
   1. PIXEL FONT — pixel-exact copy of the in-game monitor font.
   4x5 glyphs, 5px advance (space 4px), 6px line height, uppercase only.
============================================================================ */
const FONT = (function(){
  // EXACT Stormworks monitor font — extracted from "PixelFont" (nameous, 2021),
  // the font used by the game and the LifeBoatAPI/VSCode simulator.
  // Each glyph = 5 rows x 4 cols ('1' = lit pixel) + its advance in pixels.
  // Every char advances 5px except space (4px). Line height is 6px.
  const g = {};
  const d = (ch, adv, rows) => { g[ch] = {a:adv, r:rows}; };
  d(' ',4,["0000","0000","0000","0000","0000"]);
  d('!',5,["0100","0100","0100","0000","0100"]);
  d('"',5,["1010","1010","0000","0000","0000"]);
  d('#',5,["1010","1111","1010","1111","1010"]);
  d('$',5,["0111","1010","0110","0101","1110"]);
  d('%',5,["1100","0001","0110","1000","0011"]);
  d('&',5,["0100","1010","0100","1010","0101"]);
  d('\'',5,["0100","0100","0000","0000","0000"]);
  d('(',5,["0010","0100","0100","0100","0010"]);
  d(')',5,["0100","0010","0010","0010","0100"]);
  d('*',5,["1001","0110","1111","0110","1001"]);
  d('+',5,["0000","0100","1110","0100","0000"]);
  d(',',5,["0000","0000","0000","0100","1000"]);
  d('-',5,["0000","0000","1110","0000","0000"]);
  d('.',5,["0000","0000","0000","0000","0100"]);
  d('/',5,["0010","0010","0100","1000","1000"]);
  d('0',5,["0110","1011","1101","1001","0110"]);
  d('1',5,["0010","0110","0010","0010","0010"]);
  d('2',5,["0110","1001","0010","0100","1111"]);
  d('3',5,["1110","0001","0110","0001","1110"]);
  d('4',5,["1001","1001","1111","0001","0001"]);
  d('5',5,["1111","1000","1110","0001","1110"]);
  d('6',5,["0110","1000","1110","1001","0110"]);
  d('7',5,["1111","0001","0010","0010","0010"]);
  d('8',5,["0110","1001","0110","1001","0110"]);
  d('9',5,["0110","1001","0111","0001","0110"]);
  d(':',5,["0000","0100","0000","0100","0000"]);
  d(';',5,["0000","0100","0000","0100","0100"]);
  d('<',5,["0010","0100","1000","0100","0010"]);
  d('=',5,["0000","1110","0000","1110","0000"]);
  d('>',5,["1000","0100","0010","0100","1000"]);
  d('?',5,["1100","0010","0100","0000","0100"]);
  d('@',5,["0110","1001","1011","1000","0111"]);
  d('A',5,["0110","1001","1111","1001","1001"]);
  d('B',5,["1110","1001","1110","1001","1110"]);
  d('C',5,["0110","1001","1000","1001","0110"]);
  d('D',5,["1110","1001","1001","1001","1110"]);
  d('E',5,["1111","1000","1110","1000","1111"]);
  d('F',5,["1111","1000","1110","1000","1000"]);
  d('G',5,["0110","1000","1011","1001","0110"]);
  d('H',5,["1001","1001","1111","1001","1001"]);
  d('I',5,["0100","0100","0100","0100","0100"]);
  d('J',5,["0001","0001","0001","1001","0110"]);
  d('K',5,["1001","1010","1100","1010","1001"]);
  d('L',5,["1000","1000","1000","1000","1111"]);
  d('M',5,["1001","1111","1001","1001","1001"]);
  d('N',5,["1001","1101","1011","1001","1001"]);
  d('O',5,["0110","1001","1001","1001","0110"]);
  d('P',5,["1110","1001","1110","1000","1000"]);
  d('Q',5,["0110","1001","1001","1011","0111"]);
  d('R',5,["1110","1001","1110","1010","1001"]);
  d('S',5,["0111","1000","0110","0001","1110"]);
  d('T',5,["1110","0100","0100","0100","0100"]);
  d('U',5,["1001","1001","1001","1001","0110"]);
  d('V',5,["1010","1010","1010","1010","0100"]);
  d('W',5,["1001","1001","1001","1111","1001"]);
  d('X',5,["1001","1001","0110","1001","1001"]);
  d('Y',5,["1010","1010","0100","0100","0100"]);
  d('Z',5,["1111","0001","0110","1000","1111"]);
  d('[',5,["0110","0100","0100","0100","0110"]);
  d('\\',5,["1000","1000","0100","0010","0010"]);
  d(']',5,["0110","0010","0010","0010","0110"]);
  d('^',5,["0100","1010","0000","0000","0000"]);
  d('_',5,["0000","0000","0000","0000","1111"]);
  d('`',5,["0100","0010","0000","0000","0000"]);
  d('{',5,["0110","0100","1100","0100","0110"]);
  d('|',5,["0100","0100","0000","0100","0100"]);
  d('}',5,["1100","0100","0110","0100","1100"]);
  d('~',5,["0000","0101","1010","0000","0000"]);
  d('¦',5,["0100","0100","0000","0100","0100"]);
  d('‘',5,["0001","0010","0000","0000","0000"]);
  d('’',5,["0100","0010","0000","0000","0000"]);
  d('“',5,["0101","1010","0000","0000","0000"]);
  d('”',5,["1010","0101","0000","0000","0000"]);
  return g;
})();

/* ============================================================================
   2. SCREEN  — software pixel renderer matching the Stormworks screen API.
   We draw into an ImageData buffer at native resolution, then scale up.
============================================================================ */
const Screen = {
  cvs:null, ctx:null, W:64, H:64, buf:null, col:[255,255,255,255],

  attach(canvas){ this.cvs = canvas; this.ctx = canvas.getContext('2d'); this.ctx.imageSmoothingEnabled = false; },
  setSize(w,h){ this.W=w; this.H=h; this.cvs.width=w; this.cvs.height=h; this.buf = this.ctx.createImageData(w,h); },

  clear(r,g,b){ // wipe whole buffer to a solid colour (default black each frame)
    const d=this.buf.data;
    for(let i=0;i<d.length;i+=4){ d[i]=r; d[i+1]=g; d[i+2]=b; d[i+3]=255; }
  },
  px(x,y){ // alpha-blended single pixel
    x=Math.floor(x); y=Math.floor(y);
    if(x<0||y<0||x>=this.W||y>=this.H) return;
    const i=(y*this.W+x)*4, d=this.buf.data;
    const a=this.col[3]/255, ia=1-a;
    d[i]  = this.col[0]*a + d[i]*ia;
    d[i+1]= this.col[1]*a + d[i+1]*ia;
    d[i+2]= this.col[2]*a + d[i+2]*ia;
    d[i+3]= 255;
  },
  setColor(r,g,b,a){ if(a===undefined||a===null) a=255; this.col=[clamp255(r),clamp255(g),clamp255(b),clamp255(a)]; },

  // ------- game-accurate rasterizers -------
  // In-game quirks replicated here (verified against mrLennyn's Drawing Canvas,
  // NameousChangey's simulator and filp's stormworks-screen-api):
  //  · drawLine does NOT draw the final pixel (hence the community +0.25 trick)
  //  · drawRect outlines span (w+1) x (h+1) pixels
  //  · circles are polygons: 8 segments (r<20), 12 (r<28), 16 (r>=28)
  //  · filled shapes are GPU-style scanline fills (pixel-centre, top-left rule)
  rectF(x,y,w,h){ if(w<=0||h<=0) return;
    const x0=Math.ceil(x-0.5), y0=Math.ceil(y-0.5), x1=Math.ceil(x+w-0.5), y1=Math.ceil(y+h-0.5);
    for(let j=y0;j<y1;j++) for(let i=x0;i<x1;i++) this.px(i,j); },
  rect(x,y,w,h){ x=Math.floor(x);y=Math.floor(y);w=Math.floor(w);h=Math.floor(h);
    for(let i=0;i<=w;i++){ this.px(x+i,y); this.px(x+i,y+h); }        // in-game: w+1 / h+1
    for(let j=1;j<h;j++){ this.px(x,y+j); this.px(x+w,y+j); } },
  line(x1,y1,x2,y2){ // grid-lerp walk, END PIXEL EXCLUDED (like in-game)
    const dx=x2-x1, dy=y2-y1, N=Math.max(Math.abs(dx),Math.abs(dy));
    for(let s=0;s<N;s++){ const t=s/N; this.px(Math.round(x1+t*dx), Math.round(y1+t*dy)); } },
  _circlePts(cx,cy,r){
    const segs = r>=28?16 : r>=20?12 : 8, pts=[];
    for(let i=0;i<segs;i++){ const a=i*2*Math.PI/segs; pts.push([cx+r*Math.cos(a), cy+r*Math.sin(a)]); }
    return pts; },
  circle(cx,cy,r){ // in-game circles are polygons made of lines
    const p=this._circlePts(cx,cy,r);
    for(let i=0;i<p.length;i++){ const q=p[(i+1)%p.length]; this.line(p[i][0],p[i][1],q[0],q[1]); } },
  circleF(cx,cy,r){ this._fillPoly(this._circlePts(cx,cy,r)); },
  _fillPoly(pts){ // pixel-centre scanline fill of a convex-ish polygon
    let minY=Infinity,maxY=-Infinity;
    for(const p of pts){ if(p[1]<minY)minY=p[1]; if(p[1]>maxY)maxY=p[1]; }
    for(let y=Math.ceil(minY-0.5); y+0.5<=maxY; y++){
      const yc=y+0.5, xs=[];
      for(let i=0;i<pts.length;i++){
        const a=pts[i], b=pts[(i+1)%pts.length];
        if((a[1]<=yc&&b[1]>yc)||(b[1]<=yc&&a[1]>yc)){
          xs.push(a[0]+(yc-a[1])/(b[1]-a[1])*(b[0]-a[0]));
        }
      }
      xs.sort((a,b)=>a-b);
      for(let k=0;k+1<xs.length;k+=2){
        for(let x=Math.ceil(xs[k]-0.5); x+0.5<xs[k+1]; x++) this.px(x,y);
      }
    } },
  triangle(x1,y1,x2,y2,x3,y3){ this.line(x1,y1,x2,y2);this.line(x2,y2,x3,y3);this.line(x3,y3,x1,y1); },
  triangleF(x1,y1,x2,y2,x3,y3){ this._fillPoly([[x1,y1],[x2,y2],[x3,y3]]); },
  glyph(gx,gy,rows){ for(let r=0;r<5;r++){ const row=rows[r]; for(let c=0;c<4;c++) if(row[c]==='1') this.px(gx+c,gy+r); } },
  text(x,y,str){
    x=Math.floor(x); y=Math.floor(y); let cx=x;
    for(const ch of String(str).toUpperCase()){   // Stormworks renders text in CAPITALS
      if(ch==='\n'){ y+=6; cx=x; continue; }
      const gl = FONT[ch] || FONT['?'];
      this.glyph(cx,y,gl.r); cx+=gl.a;             // 5px advance (space 4px), like in-game
    } },
  textWidth(str){ let max=0,cur=0; for(const ch of String(str).toUpperCase()){ if(ch==='\n'){max=Math.max(max,cur);cur=0;} else cur+=(FONT[ch]||FONT['?']).a; } return Math.max(max,cur); },
  textBox(x,y,w,h,str,halign,valign){
    // word-wrap to width w (5px per char), then align inside the box
    halign=halign||0; valign=valign||0;
    const maxChars=Math.max(1,Math.floor(w/5));
    const words=String(str).split(/(\s+)/), lines=[]; let line="";
    const pushWord=(word)=>{
      if(word==="") return;
      if(word.length>maxChars){ // hard-break very long tokens
        for(let i=0;i<word.length;i+=maxChars){ if(line) {lines.push(line); line="";} lines.push(word.substr(i,maxChars)); }
        return;
      }
      if((line.length+word.length)>maxChars){ lines.push(line); line=word.replace(/^\s+/,''); }
      else line+=word;
    };
    for(const tok of words){ if(tok.includes('\n')){ const parts=tok.split('\n'); for(let i=0;i<parts.length;i++){ pushWord(parts[i]); if(i<parts.length-1){lines.push(line);line="";} } } else pushWord(tok); }
    if(line) lines.push(line);
    const lh=6, total=lines.length*lh;
    let ty = y + (valign<0?0 : valign>0? (h-total) : Math.floor((h-total)/2));
    for(const ln of lines){
      const lw=ln.length*5;
      let tx = x + (halign<0?0 : halign>0? (w-lw) : Math.floor((w-lw)/2));
      this.text(tx,ty,ln); ty+=lh;
    }
  },
};
function clamp255(v){ v=Math.round(v||0); return v<0?0:v>255?255:v; }

/* ============================================================================
   3. INPUT / OUTPUT state
============================================================================ */
const NUM_CH = 32;
const inputNumbers = new Array(NUM_CH+1).fill(0);
const inputBools   = new Array(NUM_CH+1).fill(false);
let outputNumbers  = {};
let outputBools    = {};

// view + line-tool state
let gridOn=true;
// Stormworks applies gamma to monitor colours (washed out look) — replicate it.
// c' = 255 * ((c/255)/0.85)^(1/2.4)  (see NameousChangey's simulator source)
let gammaOn=true;
const GAMMA_LUT=(()=>{ const t=new Uint8ClampedArray(256);
  for(let c=0;c<256;c++) t[c]=Math.round(255*Math.pow((c/255)/0.85, 1/2.4));
  return t; })();
let linePrev=null;            // {x1,y1,x2,y2} preview while dragging a line

// Mask Lua comments and string literals with spaces (same length) so we can
// scan for block keywords by position without false hits inside strings/comments.
function maskLua(code){
  let out='', i=0, n=code.length;
  while(i<n){
    if(code[i]==='-'&&code[i+1]==='-'){
      if(code[i+2]==='['&&code[i+3]==='['){ out+='    '; i+=4;
        while(i<n && !(code[i]===']'&&code[i+1]===']')){ out+=code[i]==='\n'?'\n':' '; i++; }
        if(i<n){ out+='  '; i+=2; } continue; }
      while(i<n && code[i]!=='\n'){ out+=' '; i++; } continue;
    }
    if(code[i]==='"'||code[i]==="'"){ const q=code[i]; out+=' '; i++;
      while(i<n && code[i]!==q){ if(code[i]==='\\'){ out+='  '; i+=2; } else { out+=code[i]==='\n'?'\n':' '; i++; } }
      if(i<n){ out+=' '; i++; } continue; }
    out+=code[i]; i++;
  }
  return out;
}
// Insert a statement line inside function <fnName>'s body (before its matching 'end').
// Creates the function (before onDraw if it's onTick) when it doesn't exist yet.
function insertIntoFunction(code, fnName, line){
  const masked=maskLua(code);
  const open=new RegExp('function\\s+'+fnName+'\\s*\\(','g');
  const m=open.exec(masked);
  if(m){
    // find matching end starting after the opener
    let i=m.index+m[0].length, depth=1;
    const kw=/\b(function|if|for|while|end)\b/g; kw.lastIndex=i;
    let t;
    while((t=kw.exec(masked))){
      if(t[1]==='end'){ depth--; if(depth===0){ break; } }
      else depth++;
    }
    if(t){ const at=t.index;             // position of the matching 'end' in original
      const lineStart=code.lastIndexOf('\n',at-1)+1;
      // VS Code-style indent: match the first indented body line, else opener indent + 4 spaces
      const openStart=code.lastIndexOf('\n',m.index)+1;
      const openIndent=(code.slice(openStart).match(/^[ \t]*/)||[''])[0];
      let bodyIndent=null;
      for(const bl of code.slice(m.index+m[0].length, lineStart).split('\n').slice(1)){
        if(bl.trim()!==''){ bodyIndent=(bl.match(/^[ \t]*/)||[''])[0]; break; }
      }
      if(bodyIndent===null || bodyIndent.length<=openIndent.length) bodyIndent=openIndent+'    ';
      return code.slice(0,lineStart)+bodyIndent+line+'\n'+code.slice(lineStart);
    }
  }
  // function not found → create it
  const block='function '+fnName+'()\n    '+line+'\nend\n';
  if(fnName==='onTick'){
    const od=maskLua(code).search(/function\s+onDraw\s*\(/);
    if(od>=0){ const ls=code.lastIndexOf('\n',od-1)+1; return code.slice(0,ls)+block+'\n'+code.slice(ls); }
  }
  return code.replace(/\s*$/,'')+'\n\n'+block;
}

/* ============================================================================
   4. LUA RUNTIME (Fengari bridge)
============================================================================ */
let L = null, fengariReady = (typeof fengari !== 'undefined');
let onTickRef=false, onDrawRef=false, lastError=null;

function lua(){ return fengari.lua; }
function aux(){ return fengari.lauxlib; }
function lib(){ return fengari.lualib; }
const S = s => fengari.to_luastring(s);
const JS = a => fengari.to_jsstring(a);

function regTable(name, fns){
  const lo=lua();
  lo.lua_newtable(L);
  for(const k in fns){ lo.lua_pushcfunction(L, fns[k]); lo.lua_setfield(L, -2, S(k)); }
  lo.lua_setglobal(L, S(name));
}

function buildLuaState(){
  const lo=lua(), lx=aux();
  L = lx.luaL_newstate();
  lib().luaL_openlibs(L);

  // ---- screen.* ----
  regTable('screen', {
    getWidth:  (L)=>{ lo.lua_pushinteger(L, Screen.W); return 1; },
    getHeight: (L)=>{ lo.lua_pushinteger(L, Screen.H); return 1; },
    setColor:  (L)=>{ Screen.setColor(lx.luaL_checknumber(L,1),lx.luaL_checknumber(L,2),lx.luaL_checknumber(L,3),lx.luaL_optnumber(L,4,255)); return 0; },
    drawClear: (L)=>{ Screen.clear(Screen.col[0],Screen.col[1],Screen.col[2]); return 0; },
    drawRect:  (L)=>{ Screen.rect(lx.luaL_checknumber(L,1),lx.luaL_checknumber(L,2),lx.luaL_checknumber(L,3),lx.luaL_checknumber(L,4)); return 0; },
    drawRectF: (L)=>{ Screen.rectF(lx.luaL_checknumber(L,1),lx.luaL_checknumber(L,2),lx.luaL_checknumber(L,3),lx.luaL_checknumber(L,4)); return 0; },
    drawLine:  (L)=>{ Screen.line(lx.luaL_checknumber(L,1),lx.luaL_checknumber(L,2),lx.luaL_checknumber(L,3),lx.luaL_checknumber(L,4)); return 0; },
    drawCircle:(L)=>{ Screen.circle(lx.luaL_checknumber(L,1),lx.luaL_checknumber(L,2),lx.luaL_checknumber(L,3)); return 0; },
    drawCircleF:(L)=>{ Screen.circleF(lx.luaL_checknumber(L,1),lx.luaL_checknumber(L,2),lx.luaL_checknumber(L,3)); return 0; },
    drawTriangle:(L)=>{ Screen.triangle(lx.luaL_checknumber(L,1),lx.luaL_checknumber(L,2),lx.luaL_checknumber(L,3),lx.luaL_checknumber(L,4),lx.luaL_checknumber(L,5),lx.luaL_checknumber(L,6)); return 0; },
    drawTriangleF:(L)=>{ Screen.triangleF(lx.luaL_checknumber(L,1),lx.luaL_checknumber(L,2),lx.luaL_checknumber(L,3),lx.luaL_checknumber(L,4),lx.luaL_checknumber(L,5),lx.luaL_checknumber(L,6)); return 0; },
    drawText:  (L)=>{ Screen.text(lx.luaL_checknumber(L,1),lx.luaL_checknumber(L,2), JS(lx.luaL_checkstring(L,3))); return 0; },
    drawTextBox:(L)=>{ Screen.textBox(lx.luaL_checknumber(L,1),lx.luaL_checknumber(L,2),lx.luaL_checknumber(L,3),lx.luaL_checknumber(L,4), JS(lx.luaL_checkstring(L,5)), lx.luaL_optnumber(L,6,0), lx.luaL_optnumber(L,7,0)); return 0; },
    // map drawing exists in SW but isn't simulated here; provide no-op stubs so scripts don't crash
    drawMap:   (L)=>0, setMapColorBase:(L)=>0, setMapColorOcean:(L)=>0, setMapColorShallows:(L)=>0,
    setMapColorLand:(L)=>0, setMapColorGrass:(L)=>0, setMapColorSand:(L)=>0, setMapColorSnow:(L)=>0,
    setMapColorRock:(L)=>0, setMapColorGravel:(L)=>0,
  });

  // ---- input.* ----
  regTable('input', {
    getNumber:(L)=>{ const c=lx.luaL_checkinteger(L,1); lo.lua_pushnumber(L, (c>=1&&c<=NUM_CH)?inputNumbers[c]:0); return 1; },
    getBool:  (L)=>{ const c=lx.luaL_checkinteger(L,1); lo.lua_pushboolean(L, (c>=1&&c<=NUM_CH)?(inputBools[c]?1:0):0); return 1; },
  });

  // ---- output.* ----
  regTable('output', {
    setNumber:(L)=>{ const c=lx.luaL_checkinteger(L,1); outputNumbers[c]=lx.luaL_checknumber(L,2); return 0; },
    setBool:  (L)=>{ const c=lx.luaL_checkinteger(L,1); outputBools[c]=lo.lua_toboolean(L,2); return 0; },
  });

  // ---- property.* (returns defaults; here so scripts that use it don't error) ----
  regTable('property', {
    getNumber:(L)=>{ lo.lua_pushnumber(L,0); return 1; },
    getBool:  (L)=>{ lo.lua_pushboolean(L,0); return 1; },
    getText:  (L)=>{ lo.lua_pushstring(L, S("")); return 1; },
  });

  // ---- override print() to write to our console ----
  lo.lua_pushcfunction(L, (L)=>{
    const n=lo.lua_gettop(L), parts=[];
    for(let i=1;i<=n;i++) parts.push( JS(lx.luaL_tolstring(L,i)) );
    logLine(parts.join('\t'),'print');
    return 0;
  });
  lo.lua_setglobal(L, S('print'));
}

// Load the user's code into the (fresh) state. Returns true on success.
function loadUserCode(code){
  const lo=lua(), lx=aux();
  outputNumbers={}; outputBools={}; lastError=null;
  let st = lx.luaL_loadstring(L, S(code));
  if(st !== lua().LUA_OK){ const msg=JS(lo.lua_tojsstring(L,-1)); logLine("Compile error: "+msg+luaHint(msg),'err'); lo.lua_pop(L,1); showScreenError("SYNTAX"); return false; }
  st = lo.lua_pcall(L,0,0,0);
  if(st !== lua().LUA_OK){ const msg=lo.lua_tojsstring(L,-1); logLine("Error while loading: "+msg+luaHint(msg),'err'); lo.lua_pop(L,1); showScreenError("ERROR"); return false; }
  // remember whether onTick / onDraw were defined
  lo.lua_getglobal(L, S('onTick')); onTickRef = lo.lua_isfunction(L,-1); lo.lua_pop(L,1);
  lo.lua_getglobal(L, S('onDraw')); onDrawRef = lo.lua_isfunction(L,-1); lo.lua_pop(L,1);
  if(!onTickRef && !onDrawRef) logLine("Heads up: no onTick() or onDraw() defined — nothing will happen.",'info');
  return true;
}

function callGlobal(name){
  if(lastError) return; // stay stopped after an error
  const lo=lua();
  lo.lua_getglobal(L, S(name));
  if(!lo.lua_isfunction(L,-1)){ lo.lua_pop(L,1); return; }
  const st = lo.lua_pcall(L,0,0,0);
  if(st !== lua().LUA_OK){
    lastError = lo.lua_tojsstring(L,-1);
    logLine("Runtime error in "+name+"(): "+lastError+luaHint(lastError),'err');
    lo.lua_pop(L,1);
    stopLoop();
    showScreenError("ERROR");
  }
}

/* ============================================================================
   5. RUN LOOP
============================================================================ */
let live=false, tick=0, rafId=null, codeLoaded=false;   // 'live' = continuous loop intent
let frameTimes=[], lastFrame=performance.now();
function isLooping(){ return rafId!==null; }

function doTick(){
  outputNumbers={}; outputBools={};
  syncInputsFromUI();
  callGlobal('onTick');
  if(lastError) return;         // keep the error screen up instead of wiping it
  Screen.clear(0,0,0);          // monitor wipes to black every frame
  Screen.col=[255,255,255,255]; // default colour each frame (like in game)
  callGlobal('onDraw');
  renderCanvas();
  refreshOutputs();
  tick++;
}

function loop(now){
  if(!live){ rafId=null; return; }
  doTick();
  if(lastError){ stopLoop(); return; }    // a runtime error pauses the loop
  frameTimes.push(now-lastFrame); lastFrame=now;
  if(frameTimes.length>30) frameTimes.shift();
  const avg=frameTimes.reduce((a,b)=>a+b,0)/frameTimes.length;
  document.getElementById('tickInfo').textContent = `tick ${tick} · ${Math.round(1000/avg)} fps`;
  rafId=requestAnimationFrame(loop);
}

// (Re)compile the user's code into a fresh Lua state.
function rebuild(){ buildLuaState(); codeLoaded=loadUserCode(getCode()); tick=0; lastError=null; }
function startLoop(){ live=true; if(rafId) return; lastFrame=performance.now(); frameTimes=[]; rafId=requestAnimationFrame(loop); }
function stopLoop(){ live=false; if(rafId) cancelAnimationFrame(rafId); rafId=null; }

// Reset = recompile fresh and run live from tick 0.
function reset(){
  if(!fengariReady){ logLine("Lua engine not loaded — connect to the internet once and reload.",'err'); return; }
  stopLoop(); clearConsole(); rebuild();
  if(codeLoaded) startLoop();
}
// Step = pause the live loop and advance exactly one tick.
function step(){
  if(!fengariReady){ logLine("Lua engine not loaded (need internet once to fetch it).",'err'); return; }
  stopLoop();
  if(!codeLoaded){ rebuild(); if(!codeLoaded) return; }
  doTick();
  document.getElementById('tickInfo').textContent=`tick ${tick} · paused (Reset to resume)`;
}
// Called (debounced) whenever the code changes: recompile and keep going live.
function liveReload(){
  if(!fengariReady) return;
  const wasLive = live;
  stopLoop(); rebuild();
  if(codeLoaded){ if(wasLive) startLoop(); else doTick(); }
}

/* ============================================================================
   6. CANVAS scaling
============================================================================ */
const scratch = document.createElement('canvas');
let currentZoom = 4;
function getZoom(){
  const view=document.getElementById('screen');
  let zoom=parseInt(document.getElementById('zoomSel').value,10);
  if(zoom===0){ // Fit — fill the available screen area as much as possible
    const maxW=view.parentElement.clientWidth-24, maxH=window.innerHeight*0.55;
    zoom=Math.max(1, Math.floor(Math.min(maxW/Screen.W, maxH/Screen.H)));
  }
  return zoom;
}
function renderCanvas(){
  const view=document.getElementById('screen');
  const zoom=getZoom(); currentZoom=zoom;
  scratch.width=Screen.W; scratch.height=Screen.H;
  const sctx=scratch.getContext('2d');
  const img=sctx.createImageData(Screen.W,Screen.H);
  img.data.set(Screen.buf.data);
  if(gammaOn){ const d=img.data;
    for(let i=0;i<d.length;i+=4){ d[i]=GAMMA_LUT[d[i]]; d[i+1]=GAMMA_LUT[d[i+1]]; d[i+2]=GAMMA_LUT[d[i+2]]; } }
  sctx.putImageData(img,0,0);
  view.width=Screen.W*zoom; view.height=Screen.H*zoom;
  view.style.width=(Screen.W*zoom)+'px'; view.style.height=(Screen.H*zoom)+'px';   // exact 1:1 display
  const c=view.getContext('2d'); c.imageSmoothingEnabled=false;
  c.clearRect(0,0,view.width,view.height);
  c.drawImage(scratch,0,0,Screen.W*zoom,Screen.H*zoom);
  if(gridOn) drawGrid(c,zoom);
  if(linePrev){                              // preview the shape you're dragging
    const z=zoom, h=z/2;
    const X1=linePrev.x1*z+h, Y1=linePrev.y1*z+h, X2=linePrev.x2*z+h, Y2=linePrev.y2*z+h;
    c.strokeStyle = (tool==='eraser')?'rgba(255,255,255,0.8)':document.getElementById('toolColor').value;
    c.lineWidth=Math.max(1,Math.round(z/3)); c.beginPath();
    if(tool==='line'){ c.moveTo(X1,Y1); c.lineTo(X2,Y2); c.stroke(); }
    else if(tool==='rect'||tool==='eraser'){ c.strokeRect(Math.min(X1,X2),Math.min(Y1,Y2),Math.abs(X2-X1),Math.abs(Y2-Y1)); }
    else if(tool==='circle'){ c.arc(X1,Y1,Math.hypot(X2-X1,Y2-Y1),0,Math.PI*2); c.stroke(); }
    else if(tool==='triangle'){ const x1=Math.min(X1,X2),x2=Math.max(X1,X2),y1=Math.min(Y1,Y2),y2=Math.max(Y1,Y2),mx=(x1+x2)/2;
      c.moveTo(x1,y2); c.lineTo(mx,y1); c.lineTo(x2,y2); c.closePath(); c.stroke(); }
  }
}
function drawGrid(c,zoom){
  if(zoom<2) return;                       // too small to be useful below 2x
  const W=Screen.W*zoom, H=Screen.H*zoom;
  c.lineWidth=1; c.strokeStyle='rgba(150,150,160,0.22)';   // one uniform pixel grid, no subgrid
  c.beginPath();
  for(let x=0;x<=Screen.W;x++){ const gx=(x===Screen.W?W-0.5:x*zoom+0.5); c.moveTo(gx,0); c.lineTo(gx,H); }
  for(let y=0;y<=Screen.H;y++){ const gy=(y===Screen.H?H-0.5:y*zoom+0.5); c.moveTo(0,gy); c.lineTo(W,gy); }
  c.stroke();
}
// Paint a visible error onto the screen so a broken script isn't just a frozen frame.
function showScreenError(tag){
  Screen.clear(0,0,0);
  Screen.setColor(255,70,70); Screen.text(2,2,tag||"ERROR");
  Screen.setColor(180,180,180); Screen.text(2,10,"see log");
  renderCanvas();
  document.getElementById('tickInfo').textContent='● code error';
}
// Friendly nudge for the most common beginner mistake: using { } like C/JS.
function luaHint(msg){
  if(/[{}]/.test(String(msg)))
    return "\n  ⟶ Tip: Lua has no { } braces. Close blocks with 'end', e.g.  function onTick() ... end";
  return "";
}

/* ============================================================================
   7. CONSOLE
============================================================================ */
function logLine(msg,cls){ const el=document.getElementById('console');
  const d=document.createElement('div'); if(cls) d.className=cls; d.textContent=msg; el.appendChild(d); el.scrollTop=el.scrollHeight; }
function clearConsole(){ document.getElementById('console').innerHTML=''; }

/* ============================================================================
   8. EDITOR (CodeMirror if available, otherwise plain textarea)
============================================================================ */
let cm=null;
function initEditor(){
  const ta=document.getElementById('editor');
  if(typeof CodeMirror!=='undefined'){
    try{
      cm=CodeMirror.fromTextArea(ta,{mode:'lua',theme:'material-darker',lineNumbers:true,indentUnit:4,tabSize:4,indentWithTabs:false,lineWrapping:false});
      cm.setSize('100%','100%');
      return;
    }catch(e){ cm=null; }
  }
  // fallback: tab support
  ta.style.display='block';
  ta.addEventListener('keydown',e=>{ if(e.key==='Tab'){ e.preventDefault(); const s=ta.selectionStart,en=ta.selectionEnd;
    ta.value=ta.value.slice(0,s)+'    '+ta.value.slice(en); ta.selectionStart=ta.selectionEnd=s+4; } });
}
function getCode(){ return cm? cm.getValue() : document.getElementById('editor').value; }
function setCode(t){ if(cm) cm.setValue(t); else document.getElementById('editor').value=t; }
function insertAtCursor(text){
  if(cm){ cm.replaceSelection(text); cm.focus(); }
  else { const ta=document.getElementById('editor'), s=ta.selectionStart, e=ta.selectionEnd;
    ta.value=ta.value.slice(0,s)+text+ta.value.slice(e); ta.selectionStart=ta.selectionEnd=s+text.length; ta.focus(); }
}

/* ============================================================================
   9. INPUT / OUTPUT UI
============================================================================ */
let activeNum=[], activeBool=[];   // channels shown in the panel — derived from the code

// Scan the editor code for input.getNumber(N) / input.getBool(N) literals.
function parseChannels(code){
  code = code.replace(/--\[\[[\s\S]*?\]\]/g,'').replace(/--.*$/gm,'');  // strip comments
  const nums=new Set(), bools=new Set(); let m;
  const reN=/input\.getNumber\s*\(\s*(\d+)\s*\)/g;
  while((m=reN.exec(code))){ const c=+m[1]; if(c>=1&&c<=NUM_CH) nums.add(c); }
  const reB=/input\.getBool\s*\(\s*(\d+)\s*\)/g;
  while((m=reB.exec(code))){ const c=+m[1]; if(c>=1&&c<=NUM_CH) bools.add(c); }
  return { nums:[...nums].sort((a,b)=>a-b), bools:[...bools].sort((a,b)=>a-b) };
}
// Make the Inputs panel mirror exactly what the code references.
function syncChannelsFromCode(){
  const p=parseChannels(getCode());
  activeNum=p.nums; activeBool=p.bools;
  buildInputUI();
}

const chMin={}, chMax={};                       // per-channel slider interval
function getMin(c){ return chMin[c]!==undefined?chMin[c]:-1; }
function getMax(c){ return chMax[c]!==undefined?chMax[c]: 1; }

function buildInputUI(){
  const nWrap=document.getElementById('numInputs'), bWrap=document.getElementById('boolInputs');
  nWrap.innerHTML=''; bWrap.innerHTML='';
  if(!activeNum.length)  nWrap.innerHTML='<div class="hint">none — use input.getNumber(n) in your code (or click “+ add”)</div>';
  if(!activeBool.length) bWrap.innerHTML='<div class="hint">none — use input.getBool(n) in your code (or click “+ add”)</div>';
  activeNum.forEach(c=>{
    const mn=getMin(c), mx=getMax(c);
    const row=document.createElement('div'); row.className='chan';
    row.innerHTML=`<span class="cl">N${c}</span>
      <input type="number" step="0.1" value="${mn}" data-ch="${c}" class="minbox" title="min">
      <input type="range" min="${mn}" max="${mx}" step="0.001" value="${clampRange(inputNumbers[c],mn,mx)}" data-ch="${c}" class="nrange">
      <input type="number" step="0.1" value="${mx}" data-ch="${c}" class="maxbox" title="max">
      <input type="number" step="0.01" value="${inputNumbers[c]}" data-ch="${c}" class="nbox" title="value">
      <button class="rm" data-ch="${c}" data-kind="n" title="remove (deletes its code line)">×</button>`;
    nWrap.appendChild(row);
  });
  activeBool.forEach(c=>{
    const row=document.createElement('div'); row.className='bchan';
    row.innerHTML=`<span class="cl">B${c}</span>
      <label><input type="checkbox" data-ch="${c}" class="bbox" ${inputBools[c]?'checked':''}> on</label>
      <button class="rm" data-ch="${c}" data-kind="b" title="remove (deletes its code line)">×</button>`;
    bWrap.appendChild(row);
  });
  nWrap.querySelectorAll('.nrange').forEach(el=>el.addEventListener('input',e=>{
    const c=+e.target.dataset.ch; inputNumbers[c]=parseFloat(e.target.value);
    nWrap.querySelector(`.nbox[data-ch="${c}"]`).value=(+inputNumbers[c]).toFixed(3); maybeStill(); }));
  nWrap.querySelectorAll('.nbox').forEach(el=>el.addEventListener('input',e=>{
    const c=+e.target.dataset.ch; inputNumbers[c]=parseFloat(e.target.value)||0;
    const r=nWrap.querySelector(`.nrange[data-ch="${c}"]`); if(r) r.value=clampRange(inputNumbers[c],getMin(c),getMax(c)); maybeStill(); }));
  nWrap.querySelectorAll('.minbox').forEach(el=>el.addEventListener('change',e=>{
    chMin[+e.target.dataset.ch]=parseFloat(e.target.value)||0; buildInputUI(); }));
  nWrap.querySelectorAll('.maxbox').forEach(el=>el.addEventListener('change',e=>{
    chMax[+e.target.dataset.ch]=parseFloat(e.target.value)||0; buildInputUI(); }));
  bWrap.querySelectorAll('.bbox').forEach(el=>el.addEventListener('change',e=>{
    inputBools[+e.target.dataset.ch]=e.target.checked; maybeStill(); }));
  document.querySelectorAll('#tab-inputs .rm').forEach(el=>el.addEventListener('click',e=>{
    removeChannel(e.currentTarget.dataset.kind, +e.currentTarget.dataset.ch); }));
}
// × removes a channel by deleting any code line that references it (keeps code as the source of truth).
function removeChannel(kind, c){
  const pat = kind==='n'
    ? new RegExp('input\\.getNumber\\s*\\(\\s*'+c+'\\s*\\)')
    : new RegExp('input\\.getBool\\s*\\(\\s*'+c+'\\s*\\)');
  const kept=getCode().split('\n').filter(ln=>!pat.test(ln));
  setCode(kept.join('\n')); syncChannelsFromCode(); liveReload();
}
// "+ add": pick the next unused channel and add a proper statement INSIDE onTick (creating it if needed).
function addNumInput(){ const c=nextFree(parseChannels(getCode()).nums);
  if(c===null){logLine('All 32 number channels are already used.','info');return;}
  setCode(insertIntoFunction(getCode(),'onTick','n'+c+' = input.getNumber('+c+')')); syncChannelsFromCode(); }
function addBoolInput(){ const c=nextFree(parseChannels(getCode()).bools);
  if(c===null){logLine('All 32 boolean channels are already used.','info');return;}
  setCode(insertIntoFunction(getCode(),'onTick','b'+c+' = input.getBool('+c+')')); syncChannelsFromCode(); }
function nextFree(list){ for(let i=1;i<=NUM_CH;i++) if(!list.includes(i)) return i; return null; }
function clampRange(v,min,max){ return v<min?min:v>max?max:v; }
function syncInputsFromUI(){ /* values are already mirrored into arrays by listeners */ }
// if paused (after Step) and code is loaded, redraw so you see input changes immediately
function maybeStill(){ if(!isLooping() && codeLoaded && fengariReady && !lastError){
  Screen.clear(0,0,0); Screen.col=[255,255,255,255];
  outputNumbers={}; outputBools={}; callGlobal('onTick'); callGlobal('onDraw'); renderCanvas(); refreshOutputs(); } }

/* ---- drawing tools: each drag/click edits the screen.* calls in onDraw ---- */
let tool='move', fillShape=false, dragStart=null, moveTarget=null;
function blurEditor(){ const ae=document.activeElement; if(ae && ae.blur) ae.blur(); }   // un-focus the code editor
function hexToRgb(h){ h=h.replace('#',''); return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]; }
function curColor(){ return hexToRgb(document.getElementById('toolColor').value); }
function setTool(t){ tool=t;
  document.querySelectorAll('#screenToolbar [data-tool]').forEach(b=>b.classList.toggle('toggled', b.dataset.tool===t));
  document.getElementById('screen').style.cursor = (t==='move')?'move':'crosshair';
}
function setFill(on){ fillShape=on; document.getElementById('fillToggle').classList.toggle('toggled',on); }

/* --- parse onDraw's screen.draw* calls so Move and Eraser act on whole shapes --- */
const SN='\\s*(-?\\d+(?:\\.\\d+)?)\\s*';
const SHAPE_RE={
  line:   new RegExp('screen\\.drawLine\\('+SN+','+SN+','+SN+','+SN+'\\)'),
  rect:   new RegExp('screen\\.(drawRectF?)\\('+SN+','+SN+','+SN+','+SN+'\\)'),
  circle: new RegExp('screen\\.(drawCircleF?)\\('+SN+','+SN+','+SN+'\\)'),
  tri:    new RegExp('screen\\.(drawTriangleF?)\\('+SN+','+SN+','+SN+','+SN+','+SN+','+SN+'\\)'),
  text:   new RegExp('screen\\.drawText\\('+SN+','+SN+',\\s*(.+)\\)')   // x,y must be literals; text arg can be anything
};
function bbPts(pts){ const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),x=Math.min(...xs),y=Math.min(...ys); return {x,y,w:Math.max(...xs)-x,h:Math.max(...ys)-y}; }
function parseShapes(){
  const lines=getCode().split('\n'), out=[]; let m;
  for(let i=0;i<lines.length;i++){ const ln=lines[i];
    if(m=ln.match(SHAPE_RE.line)){ const a=[+m[1],+m[2],+m[3],+m[4]]; out.push({line:i,type:'line',fn:'drawLine',nums:a,bbox:bbPts([[a[0],a[1]],[a[2],a[3]]])}); }
    else if(m=ln.match(SHAPE_RE.rect)){ const a=[+m[2],+m[3],+m[4],+m[5]]; out.push({line:i,type:'rect',fn:m[1],nums:a,bbox:{x:a[0],y:a[1],w:a[2],h:a[3]}}); }
    else if(m=ln.match(SHAPE_RE.circle)){ const a=[+m[2],+m[3],+m[4]]; out.push({line:i,type:'circle',fn:m[1],nums:a,bbox:{x:a[0]-a[2],y:a[1]-a[2],w:a[2]*2,h:a[2]*2}}); }
    else if(m=ln.match(SHAPE_RE.tri)){ const a=[+m[2],+m[3],+m[4],+m[5],+m[6],+m[7]]; out.push({line:i,type:'tri',fn:m[1],nums:a,bbox:bbPts([[a[0],a[1]],[a[2],a[3]],[a[4],a[5]]])}); }
    else if(m=ln.match(SHAPE_RE.text)){ const a=[+m[1],+m[2]], arg=m[3].trim();
      const lit=(arg.match(/"((?:[^"\\]|\\.)*)"/g)||[]).join('').replace(/"/g,'');   // text from any quoted parts
      const dyn=/\.\./.test(arg) || !/^"(?:[^"\\]|\\.)*"$/.test(arg);                 // concatenation / non-literal?
      const chars=Math.max(2, lit.length + (dyn?6:0));                                // estimate width for the grab box
      out.push({line:i,type:'text',fn:'drawText',nums:a,text:arg,bbox:{x:a[0],y:a[1],w:chars*5,h:5}}); }
  }
  return out;
}
function hitTest(px,py){ const s=parseShapes(); const PAD=2;   // generous grab area (esp. for thin text/lines)
  for(let i=s.length-1;i>=0;i--){ const b=s[i].bbox;
    if(px>=b.x-PAD && px<=b.x+b.w+PAD && py>=b.y-PAD && py<=b.y+b.h+PAD) return s[i]; } return null; }
function shapeCall(sh,nums){ return sh.type==='text'
  ? 'screen.drawText('+nums[0]+', '+nums[1]+', '+sh.text+')'   // keep the original text arg verbatim
  : 'screen.'+sh.fn+'('+nums.join(', ')+')'; }
function shiftCoord(type,idx,v,dx,dy){
  if(type==='rect'||type==='circle') return idx===0?v+dx : idx===1?v+dy : v;  // x,y then w/h/r unchanged
  return (idx%2===0)? v+dx : v+dy;                                            // line/tri/text alternate x,y
}

function screenPixel(e){
  const view=document.getElementById('screen'), rect=view.getBoundingClientRect(), zoom=getZoom();
  return { x:Math.round((e.clientX-rect.left)/zoom - 0.5), y:Math.round((e.clientY-rect.top )/zoom - 0.5) };
}
function toolDown(e){
  blurEditor();                                   // clicking the screen un-focuses the code editor
  const p=screenPixel(e);
  if(tool==='eyedropper'){ pickColour(p); return; }
  if(tool==='eraser'){ const s=hitTest(p.x,p.y); if(s) deleteShape(s); else logLine('Eraser: no shape there.','info'); return; }
  if(tool==='text'){ openTextPopup(e,p); return; }
  if(tool==='move'){ const s=hitTest(p.x,p.y); moveTarget = s ? {s, orig:s.nums.slice(), start:p} : null;
    if(!s) logLine('Move: click on a shape to grab it.','info'); return; }
  dragStart=p; linePrev={x1:p.x,y1:p.y,x2:p.x,y2:p.y}; renderCanvas();
}
let moveRAF=null;
function toolMove(e){
  if(moveTarget){ const p=screenPixel(e), dx=p.x-moveTarget.start.x, dy=p.y-moveTarget.start.y, s=moveTarget.s;
    const n=moveTarget.orig.map((v,idx)=>shiftCoord(s.type,idx,v,dx,dy));
    const lines=getCode().split('\n'); const nl=lines[s.line].replace(SHAPE_RE[s.type], ()=>shapeCall(s,n));
    if(nl!==lines[s.line]){ lines[s.line]=nl; setCode(lines.join('\n'));
      if(!moveRAF) moveRAF=requestAnimationFrame(()=>{ moveRAF=null; liveReload(); }); }
    return; }
  if(!dragStart) return; const p=screenPixel(e); linePrev={x1:dragStart.x,y1:dragStart.y,x2:p.x,y2:p.y}; renderCanvas();
}
function toolUp(e){
  if(moveTarget){ moveTarget=null; liveReload(); return; }
  if(!dragStart) return;
  const p=screenPixel(e), a=dragStart; dragStart=null; linePrev=null;
  const noDrag = (a.x===p.x && a.y===p.y);
  if(noDrag){ renderCanvas(); return; }          // ignore a non-drag for shapes
  const f=fillShape?'F':'';
  if(tool==='line')      insertDraw(['screen.drawLine('+a.x+', '+a.y+', '+(p.x+0.25)+', '+(p.y+0.25)+')']);  // +0.25: in-game lines skip the end pixel
  else if(tool==='rect'){ const x=Math.min(a.x,p.x),y=Math.min(a.y,p.y),w=Math.abs(p.x-a.x),h=Math.abs(p.y-a.y);
    if(fillShape) insertDraw(['screen.drawRectF('+x+', '+y+', '+(w+1)+', '+(h+1)+')']);
    else insertDraw(['screen.drawRect('+x+', '+y+', '+w+', '+h+')']); }
  else if(tool==='circle'){ const r=Math.round(Math.hypot(p.x-a.x,p.y-a.y));
    insertDraw(['screen.drawCircle'+f+'('+a.x+', '+a.y+', '+r+')']); }
  else if(tool==='triangle'){ const x1=Math.min(a.x,p.x),x2=Math.max(a.x,p.x),y1=Math.min(a.y,p.y),y2=Math.max(a.y,p.y),mx=Math.round((x1+x2)/2);
    insertDraw(['screen.drawTriangle'+f+'('+x1+', '+y2+', '+mx+', '+y1+', '+x2+', '+y2+')']); }
  renderCanvas();
}
/* --- current colour lives as a setColor in onDraw, updated the moment you pick --- */
function setColorStmt(c){ return 'screen.setColor('+c[0]+', '+c[1]+', '+c[2]+')'; }
function onDrawEndChar(code){               // char index of onDraw's matching 'end', or -1
  const masked=maskLua(code), m=/function\s+onDraw\s*\(/.exec(masked); if(!m) return -1;
  let depth=1; const kw=/\b(function|if|for|while|end)\b/g; kw.lastIndex=m.index+m[0].length; let t;
  while((t=kw.exec(masked))){ if(t[1]==='end'){ depth--; if(depth===0) return t.index; } else depth++; }
  return -1;
}
function lastOnDrawStmtLine(code){          // line index of the last statement inside onDraw, or -1
  const ec=onDrawEndChar(code); if(ec<0) return -1;
  const endLine=code.slice(0,ec).split('\n').length-1, lines=code.split('\n');
  for(let i=endLine-1;i>=0;i--){ const t=lines[i].trim(); if(t==='') continue;
    if(/function\s+onDraw\s*\(/.test(lines[i])) return -1; return i; }
  return -1;
}
// Picking a colour writes it into the code right away (replacing a trailing setColor so it doesn't stack).
function commitColor(){
  const stmt=setColorStmt(curColor()); let code=getCode();
  const li=lastOnDrawStmtLine(code), lines=code.split('\n');
  if(li>=0 && /^\s*screen\.setColor\s*\(/.test(lines[li])){ lines[li]=lines[li].replace(/screen\.setColor\s*\([^)]*\)/, stmt); code=lines.join('\n'); }
  else code=insertIntoFunction(code,'onDraw',stmt);
  setCode(code); liveReload();
}
// "r, g, b" of the LAST setColor anywhere inside onDraw (the active colour), or null. Ignores setColor inside strings.
function lastOnDrawColor(code){
  const ec=onDrawEndChar(code); if(ec<0) return null;
  const masked=maskLua(code), m=/function\s+onDraw\s*\(/.exec(masked); if(!m) return null;
  const body=masked.slice(m.index, ec);
  const re=/screen\.setColor\s*\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/g; let mm, last=null;
  while((mm=re.exec(body))) last=mm[1]+', '+mm[2]+', '+mm[3];
  return last;
}
function insertDraw(stmts){
  let code=getCode(); const c=curColor(), colStr=c[0]+', '+c[1]+', '+c[2];
  if(lastOnDrawColor(code)!==colStr) code=insertIntoFunction(code,'onDraw',setColorStmt(c));  // only add setColor when the colour actually changed
  for(const s of stmts) code=insertIntoFunction(code,'onDraw',s);
  setCode(code); liveReload();
}
function deleteShape(s){                          // erase a whole shape = remove its code line (+ its paired setColor)
  const lines=getCode().split('\n');
  lines.splice(s.line,1);
  if(s.line-1>=0 && /^\s*screen\.setColor\s*\(/.test(lines[s.line-1])) lines.splice(s.line-1,1);
  setCode(lines.join('\n')); liveReload();
}
/* text: a small floating input near the click — no page-greying alert */
function openTextPopup(e,p){
  closeTextPopup();
  const pop=document.createElement('div'); pop.id='textPop'; pop.className='textpop';
  pop.innerHTML='<input type="text" placeholder="text…" spellcheck="false">';
  document.body.appendChild(pop);
  pop.style.left=Math.min(e.clientX, window.innerWidth-160)+'px';
  pop.style.top=Math.min(e.clientY, window.innerHeight-50)+'px';
  const inp=pop.querySelector('input'); setTimeout(()=>inp.focus(),0);
  inp.addEventListener('keydown',ev=>{ ev.stopPropagation();
    if(ev.key==='Enter'){ const t=inp.value; closeTextPopup(); if(t) insertText(p,t); }
    else if(ev.key==='Escape'){ closeTextPopup(); } });
  inp.addEventListener('blur',()=>setTimeout(closeTextPopup,120));
}
function closeTextPopup(){ const el=document.getElementById('textPop'); if(el) el.remove(); }
function insertText(p,t){ t=t.replace(/\\/g,'\\\\').replace(/"/g,'\\"'); insertDraw(['screen.drawText('+p.x+', '+p.y+', "'+t+'")']); }
function pickColour(p){
  if(p.x<0||p.y<0||p.x>=Screen.W||p.y>=Screen.H) return;
  const i=(p.y*Screen.W+p.x)*4, d=Screen.buf.data;
  const hex='#'+[d[i],d[i+1],d[i+2]].map(v=>(v|0).toString(16).padStart(2,'0')).join('');
  document.getElementById('toolColor').value=hex;
  logLine('Picked colour '+hex,'info');
  commitColor();                                   // write the picked colour into the code now
}
function doUndo(){ if(cm) cm.undo(); }
function doRedo(){ if(cm) cm.redo(); }
function copyCode(){ navigator.clipboard.writeText(getCode())
  .then(()=>logLine('Code copied to clipboard.','info'), ()=>logLine('Copy failed — click the editor and press Ctrl+A then Ctrl+C.','err')); }
// Safe compactor for the 4096-char limit: strips comments + extra whitespace, never touches string contents.
function compactLua(code){
  let out='', i=0, n=code.length;
  const pushSpace=()=>{ const last=out[out.length-1]; if(out.length && last!==' ' && last!=='\n') out+=' '; };
  while(i<n){
    const c=code[i], d=code[i+1];
    if(c==='['){ const m=/^\[(=*)\[/.exec(code.slice(i,i+20));   // long string [[ ]] / [=[ ]=] — keep verbatim
      if(m){ const close=']'+m[1]+']'; let end=code.indexOf(close,i+m[0].length); end=end<0?n:end+close.length; out+=code.slice(i,end); i=end; continue; } }
    if(c==='"'||c==="'"){ out+=c; i++; while(i<n){ const ch=code[i]; out+=ch; i++; if(ch==='\\'){ if(i<n){out+=code[i];i++;} continue;} if(ch===c) break; } continue; }
    if(c==='-'&&d==='-'){ const bm=/^--\[(=*)\[/.exec(code.slice(i,i+20));   // block comment
      if(bm){ const close=']'+bm[1]+']'; let end=code.indexOf(close,i+bm[0].length); i=end<0?n:end+close.length; continue; }
      while(i<n && code[i]!=='\n') i++; continue; }                          // line comment
    if(c===' '||c==='\t'){ pushSpace(); i++; continue; }
    if(c==='\n'||c==='\r'){ while(out.length && out[out.length-1]===' ') out=out.slice(0,-1); if(out.length && out[out.length-1]!=='\n') out+='\n'; i++; continue; }
    out+=c; i++;
  }
  return out.replace(/^\n+/,'').replace(/\n+$/,'');
}
// Split code into string vs non-string segments so we never rewrite anything inside a string.
function segLua(code){ const segs=[]; let i=0,n=code.length,buf='';
  const flush=()=>{ if(buf){segs.push({str:false,text:buf}); buf='';} };
  while(i<n){ const c=code[i];
    if(c==='['){ const m=/^\[(=*)\[/.exec(code.slice(i,i+20)); if(m){ flush(); const close=']'+m[1]+']'; let e=code.indexOf(close,i+m[0].length); e=e<0?n:e+close.length; segs.push({str:true,text:code.slice(i,e)}); i=e; continue; } }
    if(c==='"'||c==="'"){ flush(); let j=i+1; while(j<n){ if(code[j]==='\\'){j+=2;continue;} if(code[j]===c){j++;break;} j++; } segs.push({str:true,text:code.slice(i,j)}); i=j; continue; }
    buf+=c; i++; }
  flush(); return segs; }
// Alias API functions used 2+ times (e.g. a=screen.setColor), like mrLennyn's "Compact". Only aliases the
// stable global namespaces, never touches strings, and picks names that don't clash with your variables.
const ALIAS_NS='screen|input|output|math|string|table|property';
function aliasLua(code){
  const segs=segLua(code), counts={}, idents=new Set();
  const reFn=new RegExp('('+ALIAS_NS+')\\.([A-Za-z_]\\w*)','g'), reId=/[A-Za-z_]\w*/g;
  for(const s of segs){ if(s.str) continue; let m;
    reFn.lastIndex=0; while((m=reFn.exec(s.text))){ const pre=s.text[m.index-1]; if(pre==='.'||/\w/.test(pre||'')) continue; counts[m[0]]=(counts[m[0]]||0)+1; }
    reId.lastIndex=0; while((m=reId.exec(s.text))) idents.add(m[0]); }
  const targets=Object.keys(counts).filter(k=>counts[k]>=2).sort((a,b)=>counts[b]-counts[a]);
  if(!targets.length) return code;
  const KW=new Set('and break do else elseif end false for function goto if in local nil not or repeat return then true until while'.split(' '));
  const used=new Set([...idents,...KW]);
  // Readable aliases: namespace initial + the method's capitals (or first letter),
  // e.g. screen.drawText -> SDT, screen.setColor -> SSC, math.floor -> MF.
  const name=(full)=>{
    const dot=full.indexOf('.'), ns=full.slice(0,dot), fn=full.slice(dot+1);
    const caps=fn[0].toUpperCase()+((fn.match(/[A-Z]/g)||[]).join(''));
    const base=ns[0].toUpperCase()+caps;
    let cand=base, i=1;
    while(used.has(cand)){
      cand = (i<fn.length) ? ns[0].toUpperCase()+fn.slice(0,i+1).toUpperCase() : base+i;
      i++;
    }
    used.add(cand); return cand;
  };
  const map={}; for(const t of targets) map[t]=name(t);
  const keys=Object.keys(map).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.]/g,'\\.'));
  const reRep=new RegExp('(^|[^\\w.])('+keys.join('|')+')\\b','g');
  let out=''; for(const s of segs){ out += s.str? s.text : s.text.replace(reRep,(_,pre,fn)=>pre+map[fn]); }
  return targets.map(t=>map[t]+'='+t).join('\n')+'\n'+out;
}
function copyCompact(){
  const before=getCode(), after=aliasLua(compactLua(before));
  navigator.clipboard.writeText(after).then(
    ()=>logLine('Compact code copied — '+before.length+' → '+after.length+' chars (comments/whitespace stripped, repeated calls aliased, e.g. SDT=screen.drawText; strings untouched).','info'),
    ()=>logLine('Copy failed — click the editor and press Ctrl+A then Ctrl+C.','err')); }

function refreshOutputs(){
  const nO=document.getElementById('numOutputs'), bO=document.getElementById('boolOutputs');
  const nk=Object.keys(outputNumbers).sort((a,b)=>a-b);
  const bk=Object.keys(outputBools).sort((a,b)=>a-b);
  nO.innerHTML = nk.length? nk.map(c=>`<div class="out-row"><span>ch ${c}</span><span>${(+outputNumbers[c]).toFixed(3)}</span></div>`).join('') : '<div class="hint">nothing set yet</div>';
  bO.innerHTML = bk.length? bk.map(c=>`<div class="out-row"><span>ch ${c}</span><span>${outputBools[c]?'true':'false'}</span></div>`).join('') : '<div class="hint">nothing set yet</div>';
}

/* ============================================================================
   10. EXAMPLES / LESSONS
============================================================================ */
const EXAMPLES = {

"4 · map(): the gauge workhorse":
`-- The single most useful helper: remap a value from one range to another.
-- Here: input 0..1  ->  speed 0..200, and  ->  a bar height.
function map(x, inMin, inMax, outMin, outMax)
    return outMin + (x - inMin) * (outMax - outMin) / (inMax - inMin)
end

speed = 0   -- a GLOBAL variable keeps its value between ticks

function onTick()
    -- onTick() runs 60x per second. Put logic/maths here.
    speed = input.getNumber(1)
end

function onDraw()
    local w, h = screen.getWidth(), screen.getHeight()
    local kmh  = map(speed, 0, 1, 0, 200)
    local barH = map(speed, 0, 1, 0, h)

    screen.setColor(0, 200, 255)
    screen.drawRectF(0, h - barH, w, barH)        -- grows from the bottom
    screen.setColor(255, 255, 255)
    screen.drawText(2, 2, math.floor(kmh) .. " kmh")  -- '..' joins strings
end`,

"5 · Spinning needle":
`-- A needle is just a line from a centre point, rotated by an angle.
-- math.sin / math.cos use RADIANS. math.rad() converts degrees -> radians.
function map(x,a,b,c,d) return c + (x-a)*(d-c)/(b-a) end

function onDraw()
    local cx, cy = screen.getWidth()/2, screen.getHeight()/2
    local r = math.min(cx, cy) - 2
    local t = input.getNumber(1)                         -- 0..1

    -- sweep the needle from -120° to +120°, like a real gauge:
    local angle = map(t, 0, 1, math.rad(-120), math.rad(120))

    -- screen Y grows DOWNWARD, and we want 0 to point straight up,
    -- so: x uses sin, y uses -cos.
    local ex = cx + math.sin(angle) * r
    local ey = cy - math.cos(angle) * r

    screen.setColor(70, 70, 80)
    screen.drawCircle(cx, cy, r)
    screen.setColor(255, 60, 60)
    screen.drawLine(cx, cy, ex, ey)
end`,

"6 · Full gauge w/ ticks":
`function map(x,a,b,c,d) return c + (x-a)*(d-c)/(b-a) end

function onDraw()
    local cx, cy = screen.getWidth()/2, screen.getHeight()-2
    local r = math.min(screen.getWidth()/2, screen.getHeight()) - 4
    local t = input.getNumber(1)                  -- 0..1

    -- tick marks every 10% across a 180° sweep
    for i = 0, 10 do
        local a = map(i/10, 0, 1, math.rad(-90), math.rad(90))
        local x1 = cx + math.sin(a) * r
        local y1 = cy - math.cos(a) * r
        local x2 = cx + math.sin(a) * (r-3)
        local y2 = cy - math.cos(a) * (r-3)
        screen.setColor(120,120,130)
        screen.drawLine(x1, y1, x2, y2)
    end

    -- the needle
    local a = map(t, 0, 1, math.rad(-90), math.rad(90))
    screen.setColor(255, 80, 40)
    screen.drawLine(cx, cy, cx + math.sin(a)*(r-4), cy - math.cos(a)*(r-4))

    screen.setColor(255,255,255)
    screen.drawText(2, 2, math.floor(t*100) .. "%")
end`,

`-- Read a button + a dial, send a throttle value OUT to other components.
-- output.setNumber(channel, value) — watch the Outputs tab on the right.
-- Turn on B1 (the button) and drag N1 (target throttle 0..1).
throttle = 0

function onTick()
    local on     = input.getBool(1)        -- a button / toggle
    local target = input.getNumber(1)      -- desired throttle 0..1
    if on then
        throttle = throttle + (target - throttle) * 0.05   -- ease toward target
    else
        throttle = throttle * 0.95                          -- spin down
    end
    output.setNumber(1, throttle)          -- send throttle out on channel 1
    output.setBool(1, throttle > 0.5)      -- e.g. a "running" lamp on channel 1
end

function onDraw()
    local h = screen.getHeight()
    screen.setColor(0, 255, 120)
    screen.drawRectF(2, h*(1-throttle), 8, h*throttle)
    screen.setColor(255,255,255)
    screen.drawText(14, 2, math.floor(throttle*100) .. "%")
end`,

t = 0
function onTick() t = t + 1 end

function onDraw()
    local cx, cy = screen.getWidth()/2, screen.getHeight()/2
    local a = t * 0.05
    screen.setColor(255, 230, 0)
    screen.drawLine(cx, cy, cx + math.cos(a)*12, cy + math.sin(a)*12)

    -- blink text once per second (60 ticks): % is the remainder operator

        screen.setColor(255, 60, 60)
        screen.drawText(2, 2, "BLINK")
    end
end`,
